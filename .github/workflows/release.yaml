name: Release

# Driven entirely by semver tags: the tag IS the release label and the Go module version, so the
# two can never drift. Cut a release with `git tag vX.Y.Z && git push --tags`; this workflow runs
# the test suite as a gate, creates the GitHub release from the tag, and then
# builds and publishes the container image to GHCR. Coverage is reported to Coveralls by the CI
# workflow on push to main (a tag run would file it under the tag ref, not main). The same tag is
# stamped into the binary at
# build time via -ldflags (see the Dockerfile), so a running instance reports the release version
# through --version and /healthz.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the GitHub release from the tag

    # The same service containers as CI, so coverage reflects the postgres/mysql/opensearch
    # integration tests rather than only the SQLite paths - the coverage number reported to
    # Coveralls should be the real one, not the subset that runs without dependencies.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hippocampus
          POSTGRES_PASSWORD: hippocampus
          POSTGRES_DB: hippocampus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hippocampus -d hippocampus_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: hippocampus
          MYSQL_PASSWORD: hippocampus
          MYSQL_DATABASE: hippocampus_test
          MYSQL_ROOT_PASSWORD: hippocampus
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uhippocampus -phippocampus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24

      opensearch:
        image: opensearchproject/opensearch:3.1.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 24

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The full suite (with the service containers above) gates the release: a failing test here
      # stops the GitHub release and the downstream image publish. Every package is run, including
      # cmd/ - its main-package wiring now carries unit tests too. Coverage is NOT reported to
      # Coveralls from here: a tag-triggered run reports under the tag ref, never main, so it would
      # leave the ?branch=main badge stale - the CI workflow reports it on push to main instead.
      - name: Test
        env:
          HIPPOCAMPUS_TEST_POSTGRES_DSN: postgres://hippocampus:hippocampus@localhost:5432/hippocampus_test?sslmode=disable
          HIPPOCAMPUS_TEST_MYSQL_DSN: hippocampus:hippocampus@tcp(localhost:3306)/hippocampus_test
          HIPPOCAMPUS_TEST_OPENSEARCH_URL: http://localhost:9200
        run: go test ./...

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --verify-tag refuses to release a ref that is not an existing tag; --generate-notes builds
        # the changelog from merged PRs since the previous tag.
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag

  # Cross-compile every binary and attach them to the release, so an end user can grab a runnable
  # tool without a Go toolchain - most valuable for integrations/mcp, which an MCP host
  # (Claude Desktop/Code) spawns locally over stdio, and the event-sourcing broker bridges. Everything
  # is pure Go with CGO disabled, so the whole OS/arch matrix cross-compiles from one runner with no
  # cross toolchain. Gated on `release` so the release the assets attach to already exists. A single
  # job (rather than a build matrix) keeps the checksums in one file; the builds are seconds each.
  binaries:
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: write # upload release assets

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The tag is stamped into each binary via -ldflags -X, matching the Dockerfile: the service
      # binary reads main.buildVersion, every other tool reads main.version. The four event-sourcing
      # bridges live in the separate integrations/eventsource module (its own go.mod), so they are
      # built from that directory but staged into the same stage/ dir and archived uniformly with the
      # rest. Each platform archive bundles one binary plus LICENSE; Windows gets a .zip, everything
      # else a .tar.gz. A single checksums.txt over all archives lets a downloader verify integrity.
      - name: Cross-compile and archive
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist stage

          # Binaries are built into stage/ rather than the repo root: the root holds a `hippocampus/`
          # package directory, so `go build -o hippocampus` would drop the binary inside that
          # directory instead of producing a file (and the archive/rm steps would then hit the
          # directory - "rm: cannot remove 'hippocampus': Is a directory"). LICENSE is copied into
          # stage/ once so each archive can be built from a single directory.
          cp LICENSE stage/LICENSE

          repo_root="$PWD"

          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            export GOOS="${platform%/*}" GOARCH="${platform#*/}"

            ext=""
            if [ "$GOOS" = "windows" ]; then ext=".exe"; fi

            # Root-module binaries.
            go build -trimpath -ldflags="-s -w -X main.buildVersion=${VERSION}" -o "stage/hippocampus${ext}" ./cmd/hippocampus

            # Configuration wizard (root module; serves the browser-based config/deployment builder).
            go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "stage/hippocampus-config-wizard${ext}" ./cmd/config-wizard

            # MCP bridge (separate module; build from its directory into the shared stage).
            ( cd integrations/mcp && go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "${repo_root}/stage/hippocampus-mcp${ext}" . )

            # Command-line client (separate module; build from its directory into the shared stage).
            ( cd integrations/cli && go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "${repo_root}/stage/hippo${ext}" . )

            # Event-sourcing bridges (separate module; build from its directory into the shared stage).
            for broker in nats mqtt rabbitmq kafka; do
              ( cd integrations/eventsource && go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "${repo_root}/stage/hippocampus-${broker}-bridge${ext}" "./cmd/${broker}" )
            done

            plat="${GOOS}_${GOARCH}"

            for binary in hippocampus hippocampus-config-wizard hippo hippocampus-mcp hippocampus-nats-bridge hippocampus-mqtt-bridge hippocampus-rabbitmq-bridge hippocampus-kafka-bridge; do
              if [ "$GOOS" = "windows" ]; then
                # -j junks the stage/ path so the archive entries are just the binary and LICENSE.
                zip -j -q "dist/${binary}_${VERSION}_${plat}.zip" "stage/${binary}${ext}" stage/LICENSE
              else
                tar -czf "dist/${binary}_${VERSION}_${plat}.tar.gz" -C stage "${binary}${ext}" LICENSE
              fi

              rm -f "stage/${binary}${ext}"
            done
          done

      # Native OS packages: repackage the just-built linux hippocampus binary into .deb/.rpm carrying
      # the systemd unit and a default config (deploy/nfpm/nfpm.yaml). This is a repackage, not a
      # second build - the same CGO-disabled binary the archive step produced. nfpm translates the
      # GOARCH-style arch (amd64/arm64) to each format's convention (deb amd64/arm64, rpm
      # x86_64/aarch64) itself, and version_schema: semver strips the tag's leading "v" so the deb
      # version is Debian-legal. The raw binary is built into dist/ only as nfpm's input and removed
      # before checksums/upload, so only the archives and packages ship.
      - name: Package .deb and .rpm (nfpm)
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

          for GOARCH in amd64 arm64; do
            export GOARCH ARCH="${GOARCH}" GOOS=linux

            go build -trimpath -ldflags="-s -w -X main.buildVersion=${VERSION}" -o dist/hippocampus ./cmd/hippocampus

            nfpm package -f deploy/nfpm/nfpm.yaml -p deb -t dist/
            nfpm package -f deploy/nfpm/nfpm.yaml -p rpm -t dist/

            rm -f dist/hippocampus
          done

      # One checksums file over every archive and package, generated last so it covers the nfpm output.
      - name: Checksums
        run: ( cd dist && sha256sum ./* > checksums.txt )

      - name: Upload binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --clobber so re-running the workflow on the same tag replaces assets rather than failing.
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

  # Point the Homebrew tap at this release: bump the version + sha256s in the three formulae
  # (fastbean-au/homebrew-tap) from the checksums.txt the binaries job just published, then commit
  # and push to the tap repo. Gated on `binaries` so the assets and their checksums exist first.
  # Skipped automatically when the HOMEBREW_TAP_TOKEN secret is absent, so a fork or a repo without
  # the tap configured does not fail the release - the token is a cross-repo PAT/deploy key with
  # write access to the tap repo (the default GITHUB_TOKEN cannot push to another repository).
  bump-homebrew:
    needs: binaries
    runs-on: ubuntu-latest

    steps:
      - name: Check for tap token
        id: gate
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "${TAP_TOKEN}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::HOMEBREW_TAP_TOKEN not set - skipping Homebrew tap bump."
          fi

      # The bump script lives in this repo; the tap repo is checked out beside it as the write target.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - name: Checkout the tap repo
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: fastbean-au/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Bump, commit, and push the formulae
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The checksums.txt attached to this release covers every archive (the source of the
          # per-arch sha256s the formulae pin).
          gh release download "${VERSION}" --repo "${GITHUB_REPOSITORY}" --pattern checksums.txt --output checksums.txt

          python3 deploy/homebrew/bump-formulae.py "${VERSION}" checksums.txt homebrew-tap/Formula

          cd homebrew-tap

          if git diff --quiet; then
            echo "Formulae already current for ${VERSION}; nothing to push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "hippocampus ${VERSION}"
          git push

  # Build and push the container image to GitHub Container Registry, gated behind the release job
  # so a failing test suite or coverage run publishes nothing. Auth is the built-in GITHUB_TOKEN
  # (no extra secrets); the image name is ghcr.io/<owner>/<repo>. The tag is passed as VERSION so
  # the published binary reports the release version through --version and /healthz.
  publish:
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # push to GHCR

    steps:
      - uses: actions/checkout@v4

      # QEMU emulates the target arch for the small alpine RUN steps (adduser, mkdir/chown) in the
      # final image stages; the heavy Go compile is cross-compiled natively via BUILDPLATFORM. Buildx
      # (docker-container driver) is what lets build-push-action produce a multi-platform manifest.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive the image tags from the git ref: the full version, the major.minor rolling tag, and
      # (for a non-prerelease semver tag, via the default latest=auto flavor) latest.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The MCP bridge ships as its own image (Dockerfile `target: mcp`) under a separate GHCR
      # package, so the opt-in HTTP compose service - and remote MCP hosts - can pull it instead of
      # building. Same tag scheme as the service image, VERSION stamped into main.version.
      - name: Derive MCP image tags
        id: meta-mcp
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mcp
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-mcp.outputs.tags }}
          labels: ${{ steps.meta-mcp.outputs.labels }}

      # The configuration wizard ships as its own image (Dockerfile `target: config-wizard`), so the
      # hosted builder at config-builder.hippocampus-demo.com - and anyone who would rather run it
      # themselves than trust a public site with their config - can pull it instead of building.
      - name: Derive config-wizard image tags
        id: meta-config-wizard
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-config-wizard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push config-wizard image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: config-wizard
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-config-wizard.outputs.tags }}
          labels: ${{ steps.meta-config-wizard.outputs.labels }}

  # Build and push the OpenTelemetry Collector image that bundles the Hippocampus logs exporter, so
  # the integration ships as a runnable collector rather than only an OCB manifest a user must build
  # themselves. The image is assembled by integrations/otel/collector/Dockerfile (an OCB build stage
  # from builder-config.yaml), with the repository root as the build context because the manifest's
  # `replaces:` reach the sibling exporter and the repo-root contract. It publishes to a separate
  # GHCR package (<repo>-otel-collector); the root Go module never imports this module, so it stays
  # decoupled from the service build. Same tag scheme as the other images.
  publish-otel-collector:
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # push to GHCR

    steps:
      - uses: actions/checkout@v4

      # See the publish job: QEMU for the alpine RUN steps, Buildx for the multi-platform manifest.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive collector image tags
        id: meta-otel
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-otel-collector
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push collector image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: integrations/otel/collector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-otel.outputs.tags }}
          labels: ${{ steps.meta-otel.outputs.labels }}

  # Build and push the four event-sourcing broker bridge images to GHCR - one per broker, from the
  # shared integrations/eventsource/Dockerfile selected by the BROKER build-arg. Each publishes to its
  # own package (<repo>-<broker>-bridge, e.g. hippocampus-nats-bridge). The build context is the repo
  # root because the module's `replace => ../..` reaches the root contract; the root module never
  # imports it, so it stays decoupled from the service build. A matrix keeps the four builds parallel
  # and the Dockerfile single. Same tag scheme as the other images.
  publish-eventsource-bridges:
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # push to GHCR

    strategy:
      matrix:
        broker: [nats, mqtt, rabbitmq, kafka]

    steps:
      - uses: actions/checkout@v4

      # See the publish job: QEMU for the alpine RUN steps, Buildx for the multi-platform manifest.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive bridge image tags
        id: meta-bridge
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.broker }}-bridge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push bridge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: integrations/eventsource/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            BROKER=${{ matrix.broker }}
          tags: ${{ steps.meta-bridge.outputs.tags }}
          labels: ${{ steps.meta-bridge.outputs.labels }}
