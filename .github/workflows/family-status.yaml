name: Family status

# Ask, once a week, whether any repository in the family has anything left to release - and put the
# answer somewhere it will be seen.
#
# WHY A SCHEDULE RATHER THAN A RELEASE-TIME CHECK. The gap this closes does not open when the
# service releases; it opens days later, when a satellite's bump pull request is merged and its own
# release does or does not follow. Checking at release time would look at the moment the answer is
# guaranteed to be "not yet". Two satellites now tag themselves when a bump lands (their
# `release-on-bump` workflows), so most weeks this reports nothing - which is the point: what is
# left for a human is `hippocampus-obsidian`, whose version line is its own, and any week the
# automation did not fire.
#
# ONE ISSUE, REOPENED AND CLOSED RATHER THAN ONE PER RUN. A weekly job that files an issue produces
# fifty-two issues a year describing the same standing condition, and the response to that is to
# stop reading them. So there is a single issue, its body replaced with each run's report, closed
# again by the first run that finds nothing outstanding.
on:
  schedule:
    # Mondays, 22:00 UTC - Tuesday morning in AEST, so a report lands at the start of a working day
    # rather than in the middle of a weekend.
    - cron: "0 22 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write # maintain the standing status issue

concurrency:
  group: family-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The script reads every repository through the API and writes nothing anywhere. Its exit
      # codes are the signal this job runs on and they are distinct on purpose: 0 nothing
      # outstanding, 1 something to release, 2 the question could not be answered. So the exit code
      # is captured rather than allowed to fail the step - and a 2 fails the job instead of being
      # reported as unreleased work, since an API outage that files a release reminder is a false
      # alarm nobody can act on.
      - name: Collect the family's release status
        id: status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          if python3 scripts/family-status.py --check --verbose > report.txt 2>&1; then
            echo "outstanding=false" >> "$GITHUB_OUTPUT"
          else
            code=$?

            # 1 is the only code that means "something to release".
            if [ "$code" != "1" ]; then
              cat report.txt
              echo "::error::family-status.py failed with exit ${code}"
              exit "$code"
            fi

            echo "outstanding=true" >> "$GITHUB_OUTPUT"
          fi

          cat report.txt
          cat report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Maintain the status issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTSTANDING: ${{ steps.status.outputs.outstanding }}
          TITLE: "Family release status"
        run: |
          set -euo pipefail

          existing="$(gh issue list --state open --label family-status --limit 1 --json number \
            --jq '.[0].number // empty')"

          if [ "$OUTSTANDING" != "true" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --comment "$(printf 'Everything is level again — closing.\n\n```\n%s\n```\n' "$(cat report.txt)")"
              echo "closed #${existing}"
            else
              echo "nothing outstanding, and no issue open"
            fi

            exit 0
          fi

          body="$(printf 'One or more repositories in the family have work that no release carries. Generated by `scripts/family-status.py` — re-run it locally for the current picture.\n\n```\n%s\n```\n' "$(cat report.txt)")"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
            echo "updated #${existing}"
          else
            # The label has to exist before it can be applied, and a repository that has never run
            # this job does not have it.
            gh label create family-status \
              --description "Standing report from the weekly family-status job" \
              --color ededed 2>/dev/null || true

            gh issue create --title "$TITLE" --label family-status --body "$body"
          fi
