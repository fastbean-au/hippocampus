name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Build, vet, format check, and the full test suite. The postgres and mysql service containers
  # make the db/postgres_test.go and db/mysql_test.go integration tests run rather than skip -
  # they catch dialect bugs the SQLite tests structurally cannot (e.g. ON CONFLICT
  # column-reference ambiguity), so they must run on every push, not only when someone remembers
  # to run them locally.
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hippocampus
          POSTGRES_PASSWORD: hippocampus
          POSTGRES_DB: hippocampus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hippocampus -d hippocampus_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: hippocampus
          MYSQL_PASSWORD: hippocampus
          MYSQL_DATABASE: hippocampus_test
          MYSQL_ROOT_PASSWORD: hippocampus
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uhippocampus -phippocampus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24

      opensearch:
        image: opensearchproject/opensearch:3.1.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 24

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Test (including postgres, mysql, and opensearch integration tests)
        env:
          HIPPOCAMPUS_TEST_POSTGRES_DSN: postgres://hippocampus:hippocampus@localhost:5432/hippocampus_test?sslmode=disable
          HIPPOCAMPUS_TEST_MYSQL_DSN: hippocampus:hippocampus@tcp(localhost:3306)/hippocampus_test
          HIPPOCAMPUS_TEST_OPENSEARCH_URL: http://localhost:9200
        run: go test -coverprofile=coverage.out ./...

      # Coverage is reported to Coveralls only on a push to main, never on a PR: fork PRs cannot see
      # the token secret, and PR coverage must not overwrite the mainline badge. This is what keeps
      # the README's ?branch=main badge fresh - the tag-triggered release runs report under the tag
      # ref, so they never update main. Everything hand-written in the root module is reported,
      # including cmd/; the separate integration modules (integrations/mcp, otel, eventsource) are
      # tested in their own jobs and not reported here. Only the generated protobuf/gateway code
      # (contract/hippocampus*.pb*.go and *_grpc.pb.go) is filtered out, because coverage of
      # generated getters is noise rather than a signal about our code.
      - name: Report coverage to Coveralls
        if: github.event_name == 'push'
        env:
          # Repository secret; goveralls reads it via -service=github. Never inline the token.
          COVERALLS_TOKEN: ${{ secrets.COVERALLS_TOKEN }}
        run: |
          grep -vE '/contract/hippocampus[^/]*\.go:' coverage.out > coverage.filtered.out
          go install github.com/mattn/goveralls@latest
          goveralls -coverprofile=coverage.filtered.out -service=github

  # Build the image and smoke both compose stacks the same way the containerization work was
  # validated by hand: /healthz serves, a memory stores and reads back through the gateway, and
  # in the postgres stack the write demonstrably lands in the postgres service.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compose config check
        run: |
          docker compose config -q
          docker compose -f docker/docker-compose.postgres.yaml config -q
          docker compose -f docker/docker-compose.mysql.yaml config -q
          docker compose -f docker/docker-compose.opensearch.yaml config -q
          docker compose -f docker/docker-compose.corporate.yaml config -q

      # VERSION is passed as a build arg so the -ldflags injection (Dockerfile -> version.go) is
      # exercised on every push, not only at release time: /healthz must echo back the version we
      # built, proving the tag would reach the running binary.
      - name: SQLite stack smoke test
        env:
          VERSION: ci-smoke-v0.0.0
        run: |
          docker compose up --build -d
          timeout 60 sh -c 'until curl -sf http://localhost:8080/healthz; do sleep 2; done'
          curl -sf http://localhost:8080/healthz | jq -e --arg v "$VERSION" '.version.version == $v'
          id=$(curl -sf -X POST http://localhost:8080/v1/memories \
            -H 'Content-Type: application/json' \
            -d '{"body":"ci sqlite","significance":5}' | jq -r .id)
          curl -sf http://localhost:8080/v1/memories | jq -e --arg id "$id" '.memories[] | select(.id == $id)'
          docker compose down

      - name: Postgres stack smoke test
        run: |
          docker compose -f docker/docker-compose.postgres.yaml up --build -d
          timeout 60 sh -c 'until curl -sf http://localhost:8080/healthz; do sleep 2; done'
          id=$(curl -sf -X POST http://localhost:8080/v1/memories \
            -H 'Content-Type: application/json' \
            -d '{"body":"ci postgres","significance":5}' | jq -r .id)
          docker compose -f docker/docker-compose.postgres.yaml exec -T postgres \
            psql -U hippocampus -d hippocampus -t -c "SELECT id FROM memories" | grep -q "$id"
          docker compose -f docker/docker-compose.postgres.yaml down

      - name: MySQL stack smoke test
        run: |
          docker compose -f docker/docker-compose.mysql.yaml up --build -d
          timeout 120 sh -c 'until curl -sf http://localhost:8080/healthz; do sleep 2; done'
          id=$(curl -sf -X POST http://localhost:8080/v1/memories \
            -H 'Content-Type: application/json' \
            -d '{"body":"ci mysql","significance":5}' | jq -r .id)
          docker compose -f docker/docker-compose.mysql.yaml exec -T mysql \
            mysql -uhippocampus -phippocampus hippocampus -N -e "SELECT id FROM memories" | grep -q "$id"
          docker compose -f docker/docker-compose.mysql.yaml down

      # Write-through indexing is asynchronous and OpenSearch refreshes are near-real-time, so
      # the search assertion polls rather than expecting the memory immediately.
      - name: OpenSearch stack smoke test
        run: |
          docker compose -f docker/docker-compose.opensearch.yaml up --build -d
          timeout 60 sh -c 'until curl -sf http://localhost:8080/healthz; do sleep 2; done'
          id=$(curl -sf -X POST http://localhost:8080/v1/memories \
            -H 'Content-Type: application/json' \
            -d '{"body":"the quick brown fox","significance":5}' | jq -r .id)
          timeout 60 sh -c 'until curl -sf -X POST http://localhost:8080/v1/memories/search \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"fox\"}" | jq -e ".memories[] | select(.id == \"'"$id"'\")" > /dev/null; do sleep 2; done'
          docker compose -f docker/docker-compose.opensearch.yaml down

      # The four event-sourcing bridge images share one parameterised Dockerfile (BROKER build-arg)
      # built with the repo root as context. Build each on the native platform (no push) so a broken
      # Dockerfile or module build fails CI; the release workflow does the multi-arch push.
      - name: Event-sourcing bridge images build
        run: |
          for broker in nats mqtt rabbitmq kafka; do
            docker build -f integrations/eventsource/Dockerfile \
              --build-arg BROKER="$broker" \
              -t "hippocampus-${broker}-bridge:ci" .
          done

  # The OTEL collector exporter under integrations/otel is a SEPARATE Go module (its dependency tree
  # is large and kept out of the root module), so the test job's `go build/test ./...` never
  # descends into it - it would rot undetected. Build, vet, and test it here on its own. It has a
  # `replace => ../../..` back to the repo root, so the full checkout is required.
  otel-exporter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/otel/hippocampusexporter/go.mod

      - name: Build, vet, and test the exporter module
        working-directory: integrations/otel/hippocampusexporter
        run: |
          go build ./...
          go vet ./...
          go test ./...

  # The MCP bridge under integrations/mcp is a SEPARATE Go module (the modelcontextprotocol/go-sdk
  # dependency tree is kept out of the root module), so the test job's `go build/test ./...` never
  # descends into it - it would rot undetected. Build, vet, and test it here on its own. It has a
  # `replace => ../..` back to the repo root, so the full checkout is required.
  mcp-bridge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/mcp/go.mod

      - name: Build, vet, and test the MCP bridge module
        working-directory: integrations/mcp
        run: |
          go build ./...
          go vet ./...
          go test ./...

  # The command-line client under integrations/cli is a SEPARATE Go module (its client dependency
  # tree stays out of the root module), so the test job's `go build/test ./...` never descends into
  # it. Build, vet, and test the module on its own. It has a `replace => ../..` back to the repo
  # root, so the full checkout is required. Its tests are self-contained (fake gRPC client plus an
  # httptest gateway), so no service container is needed.
  cli:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/cli/go.mod

      - name: Build, vet, and test the CLI module
        working-directory: integrations/cli
        run: |
          go build ./...
          go vet ./...
          go test ./...

  # The event-sourcing broker bridges under integrations/eventsource are a SEPARATE Go module (their
  # broker-client dependency trees are kept out of the root module), so the test job's
  # `go build/test ./...` never descends into them. Build, vet, and test the module on its own. The
  # NATS adapter's coverage uses an embedded in-process server (no container), but the MQTT and
  # RabbitMQ adapters' real-connect paths need a live broker, so mosquitto and rabbitmq are started
  # here and the matching HIPPOCAMPUS_TEST_* env vars point the (otherwise-skipped) integration tests
  # at them - keeping the suite's coverage of those adapters honest, the same way the postgres/mysql/
  # opensearch service containers do for the root module. The module has a `replace => ../..` back to
  # the repo root, so the full checkout is required.
  eventsource-bridges:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/eventsource/go.mod

      # Started as docker-run steps rather than `services:` because mosquitto needs a mounted config
      # to listen on all interfaces and allow anonymous connections (a default-config mosquitto binds
      # localhost-only), and services start before the checkout that provides that config.
      - name: Start MQTT and RabbitMQ brokers
        run: |
          docker run -d --name mosquitto -p 1883:1883 \
            -v "$PWD/integrations/eventsource/testdata/mosquitto.conf:/mosquitto/config/mosquitto.conf" \
            eclipse-mosquitto:2
          # Run as the image's rabbitmq user (uid:gid 999:999) to avoid the container failing to
          # start with "Error when reading /var/lib/rabbitmq/.erlang.cookie: eacces". As root the
          # entrypoint does `chown -R rabbitmq /var/lib/rabbitmq` then drops to that user via gosu;
          # when the daemon remaps uids (rootless / userns-remap) that chown cannot take effect, so
          # the dropped-to user can no longer read its own cookie. Starting as 999:999 makes the
          # entrypoint skip the chown/gosu path entirely (id -u != 0) - the process already is the
          # rabbitmq user and the image files already belong to it.
          docker run -d --name rabbitmq --user 999:999 -p 5672:5672 \
            -e RABBITMQ_DEFAULT_USER=hippo -e RABBITMQ_DEFAULT_PASS=hippo \
            rabbitmq:3

          # Gate on the AMQP listener actually accepting connections, not just the node being up:
          # rabbitmq-diagnostics ping reports the Erlang node is alive, which can be true before the
          # 5672 listener is bound, so the integration test would then dial into a refused connection.
          # check_port_connectivity verifies the configured listeners are open. Fail the step loudly
          # if the broker never becomes ready, so a startup problem surfaces here rather than as a
          # confusing "connection refused" inside the test run.
          for i in $(seq 1 40); do
            if docker exec rabbitmq rabbitmq-diagnostics -q check_port_connectivity >/dev/null 2>&1; then
              echo "rabbitmq ready"
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "rabbitmq did not become ready in time; recent logs:" >&2
              docker logs --tail 50 rabbitmq >&2 || true
              exit 1
            fi
            sleep 3
          done

          # mosquitto has no diagnostics CLI, so gate on the host-mapped port accepting a TCP
          # connection - which is exactly what the integration test needs to reach it.
          for i in $(seq 1 20); do
            if timeout 1 bash -c '</dev/tcp/localhost/1883' >/dev/null 2>&1; then
              echo "mosquitto ready"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "mosquitto did not become ready in time; recent logs:" >&2
              docker logs --tail 50 mosquitto >&2 || true
              exit 1
            fi
            sleep 1
          done

      - name: Build, vet, and test the eventsource module
        working-directory: integrations/eventsource
        env:
          HIPPOCAMPUS_TEST_MQTT_BROKER: tcp://localhost:1883
          HIPPOCAMPUS_TEST_RABBITMQ_URL: amqp://hippo:hippo@localhost:5672/
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

  # The Obsidian plugin under integrations/obsidian is a TypeScript project outside the Go module, so
  # nothing in the Go jobs exercises it. Typecheck+bundle and run its unit tests here - this is the
  # only place they run (there is no JS runtime on the maintainer's box). `npm ci` installs from the
  # committed package-lock.json for a reproducible, drift-detecting build.
  obsidian-plugin:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: integrations/obsidian
        run: npm ci

      # Fail the build on any moderate-or-higher advisory in the dependency tree. These are all
      # build-time (dev) dependencies, but a compromised build tool can inject into the shipped
      # main.js, so a known-vulnerable toolchain must not build a release. npm ci does not audit,
      # so this is a distinct step; it queries the registry advisory database on every run and thus
      # catches advisories disclosed after the lockfile was written.
      - name: Audit dependencies
        working-directory: integrations/obsidian
        run: npm audit --audit-level=moderate

      - name: Build and test the plugin
        working-directory: integrations/obsidian
        run: |
          npm run build
          npm test
