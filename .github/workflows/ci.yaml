name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the whole workflow, set here rather than per job because every job in it only
# ever reads the repository: nothing pushes a commit, publishes an image, or comments on a PR. The
# default GITHUB_TOKEN is otherwise write-capable on a push to the default branch, so a compromised
# third-party action or dependency in any of these nine jobs would inherit that. Coveralls and the
# Homebrew tap authenticate with their own secrets, not this token, so neither needs more.
permissions:
  contents: read

jobs:
  # Build, vet, format check, and the full test suite. The postgres and mysql service containers
  # make the db/postgres_test.go and db/mysql_test.go integration tests run rather than skip -
  # they catch dialect bugs the SQLite tests structurally cannot (e.g. ON CONFLICT
  # column-reference ambiguity), so they must run on every push, not only when someone remembers
  # to run them locally.
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hippocampus
          POSTGRES_PASSWORD: hippocampus
          POSTGRES_DB: hippocampus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hippocampus -d hippocampus_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: hippocampus
          MYSQL_PASSWORD: hippocampus
          MYSQL_DATABASE: hippocampus_test
          MYSQL_ROOT_PASSWORD: hippocampus
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uhippocampus -phippocampus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24

      opensearch:
        image: opensearchproject/opensearch:3.1.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 24

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Test (including postgres, mysql, and opensearch integration tests)
        env:
          HIPPOCAMPUS_TEST_POSTGRES_DSN: postgres://hippocampus:hippocampus@localhost:5432/hippocampus_test?sslmode=disable
          HIPPOCAMPUS_TEST_MYSQL_DSN: hippocampus:hippocampus@tcp(localhost:3306)/hippocampus_test
          # The schema-upgrade fixtures (db/schema_upgrade_server_test.go) build a scratch database
          # per subtest, which the scoped MYSQL_USER above may not create. Postgres needs no
          # counterpart: POSTGRES_USER is that container's superuser.
          HIPPOCAMPUS_TEST_MYSQL_ADMIN_DSN: root:hippocampus@tcp(localhost:3306)/hippocampus_test
          HIPPOCAMPUS_TEST_OPENSEARCH_URL: http://localhost:9200
        run: go test -coverprofile=coverage.out ./...

      # The same db suite, rerun against each server dialect. HIPPOCAMPUS_TEST_DIALECT re-points
      # newTestDB (db/conformance_test.go), so the ~190 shared tests execute on Postgres and MySQL
      # rather than on SQLite alone - which is what the step above still does, and what every run
      # before this one did exclusively. Only 18 of the 74 db.Store methods had any server-driver
      # coverage at all until this existed, leaving dialect-specific code in the link graph, the
      # forgotten log and the search outbox with no test that had ever run the branch; the first run
      # of this step found spreading activation to be silently inert on Postgres.
      #
      # A separate step rather than a matrix dimension: the two servers are already up for the step
      # above, the run is under a minute each, and keeping it here means one job reports the whole
      # root module. Coverage is deliberately not collected - the SQLite run above is the coverage
      # baseline, and three profiles of the same lines would only obscure it.
      - name: Test the db suite against each server dialect
        env:
          HIPPOCAMPUS_TEST_POSTGRES_DSN: postgres://hippocampus:hippocampus@localhost:5432/hippocampus_test?sslmode=disable
          HIPPOCAMPUS_TEST_MYSQL_DSN: hippocampus:hippocampus@tcp(localhost:3306)/hippocampus_test
          HIPPOCAMPUS_TEST_MYSQL_ADMIN_DSN: root:hippocampus@tcp(localhost:3306)/hippocampus_test
        run: |
          for dialect in postgres mysql; do
            echo "::group::db suite on $dialect"
            HIPPOCAMPUS_TEST_DIALECT="$dialect" go test -count=1 ./db
            echo "::endgroup::"
          done

      # Coverage is reported to Coveralls only on a push to main, never on a PR: fork PRs cannot see
      # the token secret, and PR coverage must not overwrite the mainline badge. This is what keeps
      # the README's ?branch=main badge fresh - the tag-triggered release runs report under the tag
      # ref, so they never update main. Everything hand-written in the root module is reported,
      # including cmd/; the separate integration modules (integrations/mcp, otel, eventsource) are
      # tested in their own jobs and not reported here. Only the generated protobuf/gateway code
      # (contract/hippocampus*.pb*.go and *_grpc.pb.go) is filtered out, because coverage of
      # generated getters is noise rather than a signal about our code.
      - name: Report coverage to Coveralls
        if: github.event_name == 'push'
        env:
          # Repository secret; goveralls reads it via -service=github. Never inline the token.
          COVERALLS_TOKEN: ${{ secrets.COVERALLS_TOKEN }}
        run: |
          grep -vE '/contract/hippocampus[^/]*\.go:' coverage.out > coverage.filtered.out
          go install github.com/mattn/goveralls@latest
          goveralls -coverprofile=coverage.filtered.out -service=github

  # Every published client - the generated Go package, and anything anyone generates from
  # contract/hippocampus.proto - breaks silently on an accidental field renumbering or a removed
  # RPC. Nothing else in the repo catches it: `go generate ./contract` regenerates happily and the
  # compiler only ever sees the new descriptor. `buf breaking` compares the contract against the
  # last release tag, which is the version people actually have. Config and rationale in
  # contract/buf.yaml; the compatibility policy it enforces is in RELEASE.md.
  #
  # It always runs and always reports. What varies is whether the report is allowed to fail the
  # build, because semver permits a break in exactly two situations and a gate that goes red on a
  # permitted, documented break is a gate people learn to ignore. Both stand-downs are decided from
  # version numbers alone (below), so neither needs an edit here to arm or disarm itself.
  proto-breaking:
    runs-on: ubuntu-latest

    steps:
      # Full history and tags: the baseline is a tag, resolved below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      # The baseline is the most recent release tag reachable from HEAD - the released contract a
      # client would have generated from. The obsidian plugin's own tags (obsidian-v*, and a bare
      # 0.1.0) are excluded by the match pattern; they do not carry a contract. With no tag
      # reachable there is nothing to compare against and the check is skipped outright; every
      # other case runs buf and only decides whether its verdict is binding.
      #
      # Two stand-downs, both read off version numbers:
      #
      # 1. The baseline is pre-1.0. Semver permits a breaking change in any 0.x release and this
      #    project has taken several (see CHANGELOG.md's Compatibility section), so a break against
      #    a 0.x baseline is within the promise the version number makes. This clears itself the
      #    moment v1.0.0 is tagged.
      # 2. The next release is a major increment. The tag does not exist yet while CI runs on main,
      #    so the intended version is declared in the CHANGELOG heading - `## [Unreleased] (v2.0.0)`
      #    - and cleared by the release step that renames that heading (RELEASE.md). Only a major
      #    increment stands the gate down; declaring a minor or patch leaves it binding, which is
      #    the point of declaring one at all.
      #
      # Everything else fails closed. A missing, malformed, or lower-than-baseline marker simply
      # yields no candidate version and the gate stays binding, so a typo shows up as a red build
      # rather than as a silently disabled check.
      - name: Resolve the baseline tag
        id: baseline
        run: |
          set -euo pipefail

          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"

          if [ -z "${tag}" ]; then
            echo "No release tag reachable from HEAD; nothing to compare against."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          baseline_version="${tag#v}"
          baseline_major="${baseline_version%%.*}"
          # Trailing non-digits (a v1-rc1 style tag) would make the comparison below a fatal
          # arithmetic error rather than a verdict.
          baseline_major="${baseline_major%%[!0-9]*}"

          candidate="$(sed -n 's/^## \[Unreleased\][[:space:]]*(v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\))[[:space:]]*$/\1/p' CHANGELOG.md | head -1)"
          candidate_major="${candidate%%.*}"

          enforce=true
          reason="Comparing the contract against ${tag}; a break fails the build."

          if [ "${baseline_major}" -eq 0 ]; then
            enforce=false
            reason="Baseline ${tag} is pre-1.0, where semver permits a breaking change in any release: reporting against ${tag} without failing the build."
          elif [ -n "${candidate}" ] && [ "${candidate_major}" -gt "${baseline_major}" ]; then
            enforce=false
            reason="CHANGELOG.md declares the next release as v${candidate}, a major increment over ${tag}: reporting against ${tag} without failing the build."
          fi

          echo "::notice title=Contract compatibility::${reason}"
          echo "${reason}"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "enforce=${enforce}" >> "$GITHUB_OUTPUT"

      # --path limits the report to our contract: the vendored googleapis definitions under
      # contract/google/api/ are part of the module (they must resolve as imports) but are not ours
      # to be compatible about.
      #
      # continue-on-error is what makes a stand-down advisory rather than absent: buf still runs and
      # its report is still in the log - which is the useful half, since a deliberate break's
      # expected report is exactly what a reviewer wants to read - but the step's failure does not
      # fail the job.
      - name: Check the contract for breaking changes
        if: steps.baseline.outputs.skip != 'true'
        continue-on-error: ${{ steps.baseline.outputs.enforce != 'true' }}
        working-directory: contract
        run: buf breaking --against "../.git#tag=${{ steps.baseline.outputs.tag }},subdir=contract" --path hippocampus.proto

  # Build the image and smoke both compose stacks the same way the containerization work was
  # validated by hand: /healthz serves, a memory stores and reads back through the gateway, and
  # in the postgres stack the write demonstrably lands in the postgres service.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compose config check
        run: |
          docker compose config -q
          docker compose -f deploy/compose/docker-compose.postgres.yaml config -q
          docker compose -f deploy/compose/docker-compose.mysql.yaml config -q
          docker compose -f deploy/compose/docker-compose.opensearch.yaml config -q
          docker compose -f deploy/compose/docker-compose.corporate.yaml config -q

      # VERSION is passed as a build arg so the -ldflags injection (Dockerfile -> version.go) is
      # exercised on every push, not only at release time: /healthz must echo back the version we
      # built, proving the tag would reach the running binary.
      - name: SQLite stack smoke test
        env:
          VERSION: ci-smoke-v0.0.0
        run: |
          docker compose up --build -d
          timeout 60 sh -c 'until curl -sf http://localhost:8080/healthz; do sleep 2; done'
          curl -sf http://localhost:8080/healthz | jq -e --arg v "$VERSION" '.version.version == $v'
          id=$(curl -sf -X POST http://localhost:8080/v1/memories \
            -H 'Content-Type: application/json' \
            -d '{"body":"ci sqlite","significance":5}' | jq -r .id)
          curl -sf http://localhost:8080/v1/memories | jq -e --arg id "$id" '.memories[] | select(.id == $id)'
          # The console is three embedded files served from three routes, so a broken embed or a
          # route left off the auth allow-list is a runtime 404/401 rather than a build failure.
          # Same argument as the config-wizard check below, and the same three curls.
          curl -sf http://localhost:8080/ui | grep -q '<body class="gated">'
          curl -sf http://localhost:8080/ui/app.js | grep -q "refreshCaps"
          curl -sf http://localhost:8080/ui/styles.css > /dev/null
          # The console is served under a CSP with no unsafe-inline, which is what the split into
          # separate files bought. A violation is silent in a browser, so assert the header is
          # actually sent rather than trusting the unit test that builds it.
          curl -sfI http://localhost:8080/ui | grep -i 'content-security-policy' | grep -qv 'unsafe-inline'
          docker compose down

      - name: Postgres stack smoke test
        run: |
          docker compose -f deploy/compose/docker-compose.postgres.yaml up --build -d
          timeout 60 sh -c 'until curl -sf http://localhost:8080/healthz; do sleep 2; done'
          id=$(curl -sf -X POST http://localhost:8080/v1/memories \
            -H 'Content-Type: application/json' \
            -d '{"body":"ci postgres","significance":5}' | jq -r .id)
          docker compose -f deploy/compose/docker-compose.postgres.yaml exec -T postgres \
            psql -U hippocampus -d hippocampus -t -c "SELECT id FROM memories" | grep -q "$id"
          docker compose -f deploy/compose/docker-compose.postgres.yaml down

      - name: MySQL stack smoke test
        run: |
          docker compose -f deploy/compose/docker-compose.mysql.yaml up --build -d
          timeout 120 sh -c 'until curl -sf http://localhost:8080/healthz; do sleep 2; done'
          id=$(curl -sf -X POST http://localhost:8080/v1/memories \
            -H 'Content-Type: application/json' \
            -d '{"body":"ci mysql","significance":5}' | jq -r .id)
          docker compose -f deploy/compose/docker-compose.mysql.yaml exec -T mysql \
            mysql -uhippocampus -phippocampus hippocampus -N -e "SELECT id FROM memories" | grep -q "$id"
          docker compose -f deploy/compose/docker-compose.mysql.yaml down

      # Write-through indexing is asynchronous and OpenSearch refreshes are near-real-time, so
      # the search assertion polls rather than expecting the memory immediately.
      - name: OpenSearch stack smoke test
        run: |
          docker compose -f deploy/compose/docker-compose.opensearch.yaml up --build -d
          timeout 60 sh -c 'until curl -sf http://localhost:8080/healthz; do sleep 2; done'
          id=$(curl -sf -X POST http://localhost:8080/v1/memories \
            -H 'Content-Type: application/json' \
            -d '{"body":"the quick brown fox","significance":5}' | jq -r .id)
          timeout 60 sh -c 'until curl -sf -X POST http://localhost:8080/v1/memories/search \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"fox\"}" | jq -e ".memories[] | select(.id == \"'"$id"'\")" > /dev/null; do sleep 2; done'
          docker compose -f deploy/compose/docker-compose.opensearch.yaml down

      # The configuration wizard ships as its own image (Dockerfile target). Build it and prove the
      # embedded single-page app is actually served - the assets live in the binary, so a broken
      # embed or a missing file is a runtime 404 rather than a build failure.
      - name: Config-wizard image smoke test
        run: |
          docker build --target config-wizard -t hippocampus-config-wizard:ci .
          docker run -d --name config-wizard -p 8091:8091 hippocampus-config-wizard:ci
          timeout 60 sh -c 'until curl -sf http://localhost:8091/healthz; do sleep 2; done'
          curl -sf http://localhost:8091/ | grep -q "Hippocampus configuration wizard"
          curl -sf http://localhost:8091/app.js | grep -q "buildConfig"
          curl -sf http://localhost:8091/styles.css > /dev/null
          docker rm -f config-wizard

      # The five event-sourcing bridge images share one parameterised Dockerfile (BROKER build-arg)
      # built with the repo root as context. Build each on the native platform (no push) so a broken
      # Dockerfile or module build fails CI; the release workflow does the multi-arch push.
      - name: Event-sourcing bridge images build
        run: |
          for broker in nats mqtt rabbitmq kafka bluesky; do
            docker build -f integrations/eventsource/Dockerfile \
              --build-arg BROKER="$broker" \
              -t "hippocampus-${broker}-bridge:ci" .
          done

      # The ingestor image, same shape: a separate module built with the repo root as context, so a
      # broken Dockerfile or module build fails CI here rather than at release time.
      - name: Ingestor image build
        run: docker build -f integrations/ingestor/Dockerfile -t hippocampus-ingestor:ci .

  # The OTEL collector exporter under integrations/otel is a SEPARATE Go module (its dependency tree
  # is large and kept out of the root module), so the test job's `go build/test ./...` never
  # descends into it - it would rot undetected. Build, vet, and test it here on its own. It has a
  # `replace => ../../..` back to the repo root, so the full checkout is required.
  otel-exporter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/otel/hippocampusexporter/go.mod

      - name: Build, vet, and test the exporter module
        working-directory: integrations/otel/hippocampusexporter
        run: |
          go build ./...
          go vet ./...
          go test ./...

  # The MCP bridge under integrations/mcp is a SEPARATE Go module (the modelcontextprotocol/go-sdk
  # dependency tree is kept out of the root module), so the test job's `go build/test ./...` never
  # descends into it - it would rot undetected. Build, vet, and test it here on its own. It has a
  # `replace => ../..` back to the repo root, so the full checkout is required.
  mcp-bridge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/mcp/go.mod

      - name: Build, vet, and test the MCP bridge module
        working-directory: integrations/mcp
        run: |
          go build ./...
          go vet ./...
          go test ./...

  # The command-line client under integrations/cli is a SEPARATE Go module (its client dependency
  # tree stays out of the root module), so the test job's `go build/test ./...` never descends into
  # it. Build, vet, and test the module on its own. It has a `replace => ../..` back to the repo
  # root, so the full checkout is required. Its tests are self-contained (fake gRPC client plus an
  # httptest gateway), so no service container is needed.
  cli:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/cli/go.mod

      - name: Build, vet, and test the CLI module
        working-directory: integrations/cli
        run: |
          go build ./...
          go vet ./...
          go test ./...

  # The ingestor under integrations/ingestor is a SEPARATE Go module (its CEL dependency tree stays
  # out of the root module), so the test job's `go build/test ./...` never descends into it. Build,
  # vet, and test the module on its own. It has a `replace => ../..` back to the repo root, so the
  # full checkout is required. Its tests are self-contained - the promoter is driven against two
  # in-memory fake instances - so no service container is needed.
  ingestor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/ingestor/go.mod

      - name: Build, vet, and test the ingestor module
        working-directory: integrations/ingestor
        run: |
          go build ./...
          go vet ./...
          go test ./...

  # The event-sourcing broker bridges under integrations/eventsource are a SEPARATE Go module (their
  # broker-client dependency trees are kept out of the root module), so the test job's
  # `go build/test ./...` never descends into them. Build, vet, and test the module on its own. The
  # NATS adapter's coverage uses an embedded in-process server (no container), but the MQTT and
  # RabbitMQ adapters' real-connect paths need a live broker, so mosquitto and rabbitmq are started
  # here and the matching HIPPOCAMPUS_TEST_* env vars point the (otherwise-skipped) integration tests
  # at them - keeping the suite's coverage of those adapters honest, the same way the postgres/mysql/
  # opensearch service containers do for the root module. The module has a `replace => ../..` back to
  # the repo root, so the full checkout is required.
  eventsource-bridges:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/eventsource/go.mod

      # Started as docker-run steps rather than `services:` because mosquitto needs a mounted config
      # to listen on all interfaces and allow anonymous connections (a default-config mosquitto binds
      # localhost-only), and services start before the checkout that provides that config.
      - name: Start MQTT and RabbitMQ brokers
        run: |
          docker run -d --name mosquitto -p 1883:1883 \
            -v "$PWD/integrations/eventsource/testdata/mosquitto.conf:/mosquitto/config/mosquitto.conf" \
            eclipse-mosquitto:2
          # Run as the image's rabbitmq user (uid:gid 999:999) to avoid the container failing to
          # start with "Error when reading /var/lib/rabbitmq/.erlang.cookie: eacces". As root the
          # entrypoint does `chown -R rabbitmq /var/lib/rabbitmq` then drops to that user via gosu;
          # when the daemon remaps uids (rootless / userns-remap) that chown cannot take effect, so
          # the dropped-to user can no longer read its own cookie. Starting as 999:999 makes the
          # entrypoint skip the chown/gosu path entirely (id -u != 0) - the process already is the
          # rabbitmq user and the image files already belong to it.
          docker run -d --name rabbitmq --user 999:999 -p 5672:5672 \
            -e RABBITMQ_DEFAULT_USER=hippo -e RABBITMQ_DEFAULT_PASS=hippo \
            rabbitmq:3

          # Gate on the AMQP listener actually accepting connections, not just the node being up:
          # rabbitmq-diagnostics ping reports the Erlang node is alive, which can be true before the
          # 5672 listener is bound, so the integration test would then dial into a refused connection.
          # check_port_connectivity verifies the configured listeners are open. Fail the step loudly
          # if the broker never becomes ready, so a startup problem surfaces here rather than as a
          # confusing "connection refused" inside the test run.
          for i in $(seq 1 40); do
            if docker exec rabbitmq rabbitmq-diagnostics -q check_port_connectivity >/dev/null 2>&1; then
              echo "rabbitmq ready"
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "rabbitmq did not become ready in time; recent logs:" >&2
              docker logs --tail 50 rabbitmq >&2 || true
              exit 1
            fi
            sleep 3
          done

          # mosquitto has no diagnostics CLI, so gate on the host-mapped port accepting a TCP
          # connection - which is exactly what the integration test needs to reach it.
          for i in $(seq 1 20); do
            if timeout 1 bash -c '</dev/tcp/localhost/1883' >/dev/null 2>&1; then
              echo "mosquitto ready"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "mosquitto did not become ready in time; recent logs:" >&2
              docker logs --tail 50 mosquitto >&2 || true
              exit 1
            fi
            sleep 1
          done

      # The Bluesky bridge needs no container at all - Jetstream is a public, unauthenticated service
      # - so its integration test costs one environment variable rather than a service definition.
      # It is set only on pushes to the default branch, deliberately: turning it on for pull requests
      # would make every fork's PR reach out to Bluesky's infrastructure, and would make CI red
      # whenever a third party's endpoint is down. The fakes cover the loop; this covers the wire.
      - name: Build, vet, and test the eventsource module
        working-directory: integrations/eventsource
        env:
          HIPPOCAMPUS_TEST_MQTT_BROKER: tcp://localhost:1883
          HIPPOCAMPUS_TEST_RABBITMQ_URL: amqp://hippo:hippo@localhost:5672/
          HIPPOCAMPUS_TEST_JETSTREAM: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'wss://jetstream2.us-east.bsky.network/subscribe' || '' }}
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

  # The Obsidian plugin under integrations/obsidian is a TypeScript project outside the Go module, so
  # nothing in the Go jobs exercises it. Typecheck+bundle and run its unit tests here - this is the
  # only place they run (there is no JS runtime on the maintainer's box). `npm ci` installs from the
  # committed package-lock.json for a reproducible, drift-detecting build.
  obsidian-plugin:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: integrations/obsidian
        run: npm ci

      # Fail the build on any moderate-or-higher advisory in the dependency tree. These are all
      # build-time (dev) dependencies, but a compromised build tool can inject into the shipped
      # main.js, so a known-vulnerable toolchain must not build a release. npm ci does not audit,
      # so this is a distinct step; it queries the registry advisory database on every run and thus
      # catches advisories disclosed after the lockfile was written.
      - name: Audit dependencies
        working-directory: integrations/obsidian
        run: npm audit --audit-level=moderate

      - name: Build and test the plugin
        working-directory: integrations/obsidian
        run: |
          npm run build
          npm test

  # The embedded console is ~2,800 lines of JavaScript that no Go job can exercise. Its pure logic
  # lives in cmd/hippocampus/webui/lib.js — the capability matrix that decides which controls a
  # caller sees, the decay-curve geometry, the escaping, the age and metadata parsing — and this
  # runs it under node's built-in test runner, plus a drift guard pairing every data-act control in
  # the markup with a handler in app.js.
  #
  # Unlike obsidian-plugin there is deliberately NOTHING to install: no dependencies, no lockfile,
  # no node_modules inside a Go source tree, and so no npm ci and no npm audit step.
  webui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test the embedded console
        working-directory: cmd/hippocampus/webuitest
        run: node --test
