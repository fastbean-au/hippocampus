syntax = "proto3";
package hippocampus.v1;
option go_package = "github.com/fastbean-au/hippocampus/contract;contract";

import "google/api/annotations.proto";

// HTTP annotations below map every RPC onto a REST-ish JSON endpoint under /v1, served by the
// grpc-gateway alongside the native gRPC API. Path-bound fields (e.g. {id}) are taken from the
// URL; for GET/DELETE the remaining fields are taken from the query string, and for POST/PATCH
// they are taken from the JSON body.
service Hippocampus {
	// Purge deletes every event and memory in the store. While it runs, all other Hippocampus RPCs
	// are rejected with Unavailable.
	rpc Purge(EmptyRequest) returns (GeneralResponse) {
		option (google.api.http) = {
			post: "/v1/purge"
		};
	}

	// Sleep manually triggers a consolidation cycle out of schedule and resets the periodic timer.
	// Rejected with FailedPrecondition on a read/write replica (consolidation.enabled: false),
	// which must never run its own cycle.
	rpc Sleep(EmptyRequest) returns (GeneralResponse) {
		option (google.api.http) = {
			post: "/v1/sleep"
		};
	}

	// PreviewConsolidation reports what a consolidation cycle would forget if one ran now, and
	// deletes nothing. It is the dry run for Sleep: the same decision rules, applied to the same
	// store, with the outcome returned instead of applied. Rejected with FailedPrecondition on a
	// read/write replica (consolidation.enabled: false), which never runs a cycle of its own and so
	// has nothing to preview.
	//
	// It is a separate RPC rather than a flag on Sleep so that the two can be authorised
	// separately - previewing what would be forgotten is a read, triggering it is not.
	rpc PreviewConsolidation(PreviewConsolidationRequest) returns (PreviewConsolidationResponse) {
		option (google.api.http) = {
			get: "/v1/sleep/preview"
		};
	}

	// ExplainConsolidation reports where individual memories stand against the consolidation rules -
	// each one's computed value, the threshold it is measured against, and how long it has before it
	// crosses - together with the capacity pressure scaling that threshold and, optionally, the decay
	// curve the configured algorithm produces. It reads nothing but the memories named in the
	// request and deletes nothing.
	//
	// Where PreviewConsolidation answers "what would a cycle forget now" across the whole store,
	// this answers "where does this memory stand, and when is it due" for memories the caller
	// already has in hand - which is why it needs only the reader tier: it enumerates nothing.
	// Rejected with FailedPrecondition on a read/write replica (consolidation.enabled: false),
	// whose configuration is not the one its store is consolidated under.
	rpc ExplainConsolidation(ExplainConsolidationRequest) returns (ExplainConsolidationResponse) {
		option (google.api.http) = {
			post: "/v1/consolidation/explain"
			body: "*"
		};
	}

	// WhoAmI reports the authenticated caller's identity and effective authorization tier
	// (reader/writer/admin), so a client - the web console - can tailor what it offers instead of
	// guessing at the token's roles. Requires only the reader tier. When the service runs without
	// authentication it reports auth_enabled false and an unrestricted (admin) tier.
	rpc WhoAmI(EmptyRequest) returns (WhoAmIResponse) {
		option (google.api.http) = {
			get: "/v1/whoami"
		};
	}

	// Events
	// StoreEvent creates an event, optionally with nested memories (each defaulted to the new
	// event's id when unset). An event below event.minimumSignificance is quietly dropped - see
	// StoreEventResponse.
	rpc StoreEvent(Event) returns (StoreEventResponse) {
		option (google.api.http) = {
			post: "/v1/events"
			body: "*"
		};
	}

	// EndEvent sets an event's time_end (defaults to now when unset). NotFound if the event does
	// not exist.
	rpc EndEvent(EndEventRequest) returns (GeneralResponse) {
		option (google.api.http) = {
			post: "/v1/events/{id}/end"
			body: "*"
		};
	}

	// UpdateEventSignificance changes an event's significance, either as an absolute value or via
	// placement (see SignificancePlacement). NotFound if the event does not exist.
	rpc UpdateEventSignificance(UpdateEventSignificanceRequest) returns (GeneralResponse) {
		option (google.api.http) = {
			patch: "/v1/events/{id}/significance"
			body: "*"
		};
	}

	// MergeEvents re-points every memory of merge_from onto merge_to. merge_to must already exist;
	// merge_from need not - an absent one simply matches no memories.
	rpc MergeEvents(MergeEventsRequest) returns (GeneralResponse) {
		option (google.api.http) = {
			post: "/v1/events/merge"
			body: "*"
		};
	}

	// DeleteEvent deletes an event. When memories is true its memories are deleted too; otherwise
	// they are kept but detached (their event_id is cleared). NotFound if the event does not exist.
	rpc DeleteEvent(DeleteEventRequest) returns (GeneralResponse) {
		option (google.api.http) = {
			delete: "/v1/events/{id}"
		};
	}

	// GetEventById fetches a single event by id; set memories to also load its nested memories.
	// NotFound if the event does not exist.
	rpc GetEventById(GetEventByIdRequest) returns (GetEventResponse) {
		option (google.api.http) = {
			get: "/v1/events/{id}"
		};
	}

	// GetEvents lists events filtered by time range, significance range, group, and metadata,
	// paginated by limit/offset (see GetEventsRequest). significance_extremum swaps the
	// significance_min/max range for "only events tied at the highest (or lowest) significance
	// value" instead.
	rpc GetEvents(GetEventsRequest) returns (GetEventsResponse) {
		option (google.api.http) = {
			get: "/v1/events"
		};
	}

	// Memories
	// StoreMemory creates a memory. A memory below memory.minimumSignificance is quietly dropped -
	// see StoreMemoryResponse.
	rpc StoreMemory(Memory) returns (StoreMemoryResponse) {
		option (google.api.http) = {
			post: "/v1/memories"
			body: "*"
		};
	}

	// UpdateMemory applies a partial update to an existing memory: only the fields carrying a value
	// (significance, body, event_id, group, time_stamp) overwrite the stored row. is_binary and
	// is_summary are NOT updatable here - they are set at creation and by ReplaceMemoriesWithSummary
	// - so any updated content must stay consistent with the memory's existing is_binary/is_summary:
	// a non-binary memory is re-indexed for content search, so its new body must remain valid text,
	// and a summary memory should keep summary-appropriate content. An unknown id returns NotFound
	// (no memory is created).
	rpc UpdateMemory(Memory) returns (GeneralResponse) {
		option (google.api.http) = {
			patch: "/v1/memories/{id}"
			body: "*"
		};
	}

	// DeleteMemories deletes the given memories by id; unknown ids are silently ignored.
	rpc DeleteMemories(DeleteMemoriesRequest) returns (GeneralResponse) {
		option (google.api.http) = {
			post: "/v1/memories/delete"
			body: "*"
		};
	}

	// GetMemories lists memories filtered by time range, significance range, group, metadata, and
	// recall state (recalled/recall_count/time_recalled, plus is_summary and is_binary), paginated
	// by limit/offset (see GetMemoriesRequest). significance_extremum swaps the significance_min/max
	// range for "only memories tied at the highest (or lowest) significance value" instead.
	rpc GetMemories(GetMemoriesRequest) returns (GetMemoriesResponse) {
		option (google.api.http) = {
			get: "/v1/memories"
		};
	}

	// RecallMemories returns the requested memories and reinforces each one: its recall time is
	// reset to now (resetting its decay clock) and its recall count is incremented (raising its
	// effective significance during consolidation). A reader-tier caller for whom reinforcement is
	// disabled (auth.readerRecallReinforces) gets a plain, non-reinforcing read instead; writer and
	// admin callers always reinforce.
	rpc RecallMemories(RecallMemoriesRequest) returns (GetMemoriesResponse) {
		option (google.api.http) = {
			post: "/v1/memories/recall"
			body: "*"
		};
	}

	// SearchMemories finds memories via the optional content-search index; see
	// SearchMemoriesRequest.
	rpc SearchMemories(SearchMemoriesRequest) returns (GetMemoriesResponse) {
		option (google.api.http) = {
			post: "/v1/memories/search"
			body: "*"
		};
	}

	// Links
	// A Link is a directed, significance-carrying association between two memories or between two
	// events. Both ends must already exist (NotFound otherwise), and both ends gain the link's
	// significance in the decay maths - a link protects what it connects in either direction (see
	// consolidation.linkSignificanceWeight). Links are removed automatically when either end is
	// forgotten.

	// LinkMemories adds or updates links from one memory to others. Re-linking an existing pair
	// overwrites that link's significance rather than adding a second link. NotFound if the memory
	// or any target does not exist; InvalidArgument on a self-link or once the memory would exceed
	// the per-item link limit.
	rpc LinkMemories(LinkMemoriesRequest) returns (GeneralResponse) {
		option (google.api.http) = {
			post: "/v1/memories/{id}/links"
			body: "*"
		};
	}

	// UnlinkMemories removes links from one memory to the named memories; unknown targets are
	// silently ignored. NotFound if the memory itself does not exist.
	rpc UnlinkMemories(UnlinkMemoriesRequest) returns (GeneralResponse) {
		option (google.api.http) = {
			post: "/v1/memories/{id}/links/delete"
			body: "*"
		};
	}

	// GetMemoryLinks returns a memory's links. By default both directions are returned (the graph is
	// stored directed but valued symmetrically); set direction to narrow it. NotFound if the memory
	// does not exist.
	rpc GetMemoryLinks(GetMemoryLinksRequest) returns (GetLinksResponse) {
		option (google.api.http) = {
			get: "/v1/memories/{id}/links"
		};
	}

	// LinkEvents is LinkMemories for events; the same rules apply.
	rpc LinkEvents(LinkEventsRequest) returns (GeneralResponse) {
		option (google.api.http) = {
			post: "/v1/events/{id}/links"
			body: "*"
		};
	}

	// UnlinkEvents is UnlinkMemories for events; the same rules apply.
	rpc UnlinkEvents(UnlinkEventsRequest) returns (GeneralResponse) {
		option (google.api.http) = {
			post: "/v1/events/{id}/links/delete"
			body: "*"
		};
	}

	// GetEventLinks is GetMemoryLinks for events; the same rules apply.
	rpc GetEventLinks(GetEventLinksRequest) returns (GetLinksResponse) {
		option (google.api.http) = {
			get: "/v1/events/{id}/links"
		};
	}

	// Summarisation
	// ReplaceMemoriesWithSummary deletes every memory of an event and replaces them with a single
	// caller-supplied summary memory, in one transaction; see ReplaceMemoriesWithSummaryRequest.
	rpc ReplaceMemoriesWithSummary(ReplaceMemoriesWithSummaryRequest) returns (ReplaceMemoriesWithSummaryResponse) {
		option (google.api.http) = {
			post: "/v1/events/{event_id}/summary"
			body: "summary"
		};
	}

	// GetSummarisationCandidates returns events identified by the most recent sleep cycle as having
	// accumulated enough quiet, unsummarised memories to be worth condensing via
	// ReplaceMemoriesWithSummary. A point-in-time snapshot, refreshed only when
	// consolidation.summarisationMinMemories is configured.
	rpc GetSummarisationCandidates(EmptyRequest) returns (GetSummarisationCandidatesResponse) {
		option (google.api.http) = {
			get: "/v1/summarisation/candidates"
		};
	}

	// SummariseMemories condenses an event's memories into a single summary using the optional
	// embedded LLM (ollama.enabled), then replaces them with it exactly as ReplaceMemoriesWithSummary
	// does - so the service generates the summary the caller would otherwise have to supply. Fails
	// with FAILED_PRECONDITION when no summariser is configured. See SummariseMemoriesRequest.
	rpc SummariseMemories(SummariseMemoriesRequest) returns (SummariseMemoriesResponse) {
		option (google.api.http) = {
			post: "/v1/events/{event_id}/summarise"
			body: "*"
		};
	}

	// Transfer and archive (embedded -> centralised)
	// Export snapshots the whole store into an archive object in S3 and records a manifest of
	// exactly what was captured; with clear set, the captured records are deleted once the upload
	// has succeeded.
	rpc Export(ExportRequest) returns (ExportResponse) {
		option (google.api.http) = {
			post: "/v1/export"
			body: "*"
		};
	}

	// Import streams an archive object from S3 into the store, upserting every record by id with
	// its full state preserved. Idempotent; aborts on the first error.
	rpc Import(ImportRequest) returns (ImportResponse) {
		option (google.api.http) = {
			post: "/v1/import"
			body: "*"
		};
	}

	// ImportBatch upserts full-state rows by id directly - the ingest half of Transfer. Nothing is
	// defaulted or gated on minimum significance; the rows carry their history.
	rpc ImportBatch(ImportBatchRequest) returns (ImportBatchResponse) {
		option (google.api.http) = {
			post: "/v1/import/batch"
			body: "*"
		};
	}

	// Transfer streams the whole store directly into a centralised instance's ImportBatch RPC,
	// recording a manifest like Export; with clear set the captured records are deleted once the
	// target has accepted every batch.
	rpc Transfer(TransferRequest) returns (TransferResponse) {
		option (google.api.http) = {
			post: "/v1/transfer"
			body: "*"
		};
	}

	// Clear deletes exactly the records captured by the Export/Transfer run that produced the
	// manifest. Memories recalled (or re-created) since the capture survive, as do events that
	// still have memories.
	rpc Clear(ClearRequest) returns (ClearResponse) {
		option (google.api.http) = {
			post: "/v1/clear"
			body: "*"
		};
	}
}

// Bool is a tri-state boolean (rather than proto3's inherent bool) so a caller can distinguish an
// explicitly-set value from one left absent. It carries Memory.is_binary - where UNSPECIFIED and
// FALSE are treated identically by the server (both mean not-binary) and only TRUE marks a memory
// as binary - and the boolean list filters (GetMemoriesRequest's recalled/is_summary/is_binary),
// where the distinction matters rather more: a proto3 bool cannot say "only the memories whose
// is_summary is false", because an unset bool and an explicit false are the same byte on the wire.
enum Bool {
	UNSPECIFIED                                                      = 0; // not set; on Memory.is_binary the server treats this the same as FALSE, on a filter it applies no restriction
	FALSE                                                            = 1; // explicitly false
	TRUE                                                             = 2; // explicitly true
}

// SignificanceExtremum selects "all events tied at the highest (or lowest) significance value"
// instead of a min/max range - the tied set is computed dynamically from whichever events match
// GetEventsRequest's other filters (time range, group), not a fixed value the caller supplies.
// Mutually exclusive with significance_min/significance_max (InvalidArgument if both are set).
enum SignificanceExtremum {
	SIGNIFICANCE_EXTREMUM_UNSPECIFIED                                = 0; // no extremum filtering; significance_min/significance_max (if set) apply as a normal range
	SIGNIFICANCE_EXTREMUM_HIGHEST                                    = 1; // return only events at the highest significance value among those matching the other filters
	SIGNIFICANCE_EXTREMUM_LOWEST                                     = 2; // return only events at the lowest significance value among those matching the other filters
}

// SignificancePlacement positions an item's significance relative to existing values instead of
// taking the absolute `significance` field. It exists because significance is a dense integer with
// no room between adjacent values: this lets a client say "just above the 5s" or "between 5 and 6"
// and have the server open a gap for it. Write-only on StoreEvent/StoreMemory/UpdateMemory and
// UpdateEventSignificance; it is never populated on read responses. When mode is UNSPECIFIED the
// absolute `significance` value is used as-is (0 meaning unranked).
message SignificancePlacement {
	enum Mode {
		UNSPECIFIED                                                     = 0; // ignore placement; use the absolute significance value
		ABOVE                                                           = 1; // rank just above the anchor, below the next-higher value
		BELOW                                                           = 2; // rank just below the anchor, above the next-lower value
		BETWEEN                                                         = 3; // rank strictly between the anchor (lower) and upper bounds
	}
	Mode                         mode                                = 1; // the placement mode
	int32                        anchor                              = 2; // anchor significance value; must be >= 1 unless anchor_id is set
	string                       anchor_id                           = 3; // anchor by an existing item's id, whose significance is looked up; that item must already be ranked (significance > 0)
	int32                        upper                               = 4; // BETWEEN only: the upper bound significance; must be >= 1 (and greater than anchor) unless upper_id is set
	string                       upper_id                            = 5; // BETWEEN only: the upper bound by an existing item's id; that item must already be ranked (significance > 0)
}

// Event is a named time span with its own significance, optionally carrying links to
// other events and/or nested memories. memories/links are populated on read only when
// requested (GetEventById, GetEvents); on StoreEvent nested memories are write-only input, each
// stored via the same rules as StoreMemory.
message Event {
	string                                 id                        = 1;  // auto-generated UUID if omitted on create; max 128 characters
	int64                                  time_start                = 2;  // UnixNano; defaults to the current time when unset (0) on create; required (> 0) once defaulted
	int64                                  time_end                  = 3;  // UnixNano; 0 means the event has not ended yet (see EndEvent); when set, must not be before time_start
	int32                                  significance              = 4;  // 0 = unranked (rank it later via UpdateEventSignificance/placement); must be >= 0; higher ranks more significant
	string                                 name                      = 5;  // required (non-empty) on create; max 256 characters
	string                                 description               = 6;  // optional; max 1024 characters
	bool                                   memories_consolidated     = 7;  // read-only: true once a sleep cycle has deleted (consolidated) some of this event's memories; ignored on write
	int64                                  link_significance         = 8;  // read-only: sum of this event's links' significance values, inbound and outbound, calculated by the server; ignored on write
	repeated Link                          links                     = 9;  // links this event declares to other events, weighted into its memories' value (see consolidation.linkSignificanceWeight). Outbound only, like Memory.links - ask GetEventLinks for both directions
	repeated Memory                        memories                  = 10; // populated on read only when requested (GetEventById/GetEvents); write-only input on StoreEvent, stored via the same rules as StoreMemory
	string                                 group                     = 11; // optional freeform grouping/context label (system, subsystem, owner, ...); max 128 characters
	SignificancePlacement                  placement                 = 12; // write-only: rank relative to existing values (see SignificancePlacement)
	map<string, string>                    metadata                  = 13; // optional multi-dimensional classification, exactly as Memory.metadata: same key charset, same 32-key/512-byte-value/4096-byte bounds, same replace-wholesale semantics on update, same opacity to the server
	bool                                   clear_metadata            = 14; // write-only: on UpdateEvent, remove all metadata (see Memory.clear_metadata for why the empty map cannot say it)
	bool                                   clear_group               = 15; // write-only: on UpdateEvent, reset group to empty (see Memory.clear_group)
}

// Link is a directed, significance-carrying association between two memories or between two events.
// One Link message describes one edge from the item carrying it to the item it names.
//
// The significance is weighted into the decay maths for BOTH ends, with diminishing returns - the
// contribution is consolidation.linkSignificanceWeight * log1p(sum of an item's link significances),
// so a well-connected memory decays more slowly without any number of links ever making it
// unforgettable. Unlike the event relationships this replaces, both ends must exist: a link is
// deleted automatically when either end is forgotten, so it can never dangle.
message Link {
	string                                 id                        = 1; // the linked memory's or event's id; must name an existing item of the same kind
	int32                                  significance              = 2; // this link's weight; 0..1000000, must not be negative - not part of the significance registry, never ranked
}

// Memory is a blob, opaque to the server, with a significance and timestamp, optionally linked to
// an event. Recalling it (RecallMemories) reinforces it: the decay clock resets and its effective
// significance rises. is_binary controls whether the body is indexed for content search (see
// SearchMemories) - a binary body is never indexed.
message Memory {
	string                                 id                        = 1;  // auto-generated UUID if omitted on create; max 128 characters
	int64                                  time_stamp                = 2;  // UnixNano; defaults to the current time when unset (0) on create; required (> 0) once defaulted
	int32                                  significance              = 3;  // 0 = unranked (rank it later via UpdateMemory/placement); must be >= 0; higher ranks more significant. On UpdateMemory, 0 with no placement leaves the existing significance unchanged - it cannot reset a memory to unranked
	string                                 event_id                  = 4;  // optional: leave unset to store the memory unassociated with any event
	string                                 body                      = 5;  // required (non-empty) on create; a proto3 string, so always valid UTF-8 on the wire - encode true binary payloads (e.g. base64) before setting is_binary; optionally capped by memory.limit.sizeBytes (0 = unlimited)
	Bool                                   is_binary                 = 6;  // set once at creation; not updatable via UpdateMemory. TRUE bodies are opaque and never indexed for content search (see SearchMemories)
	int64                                  time_recalled             = 7;  // read-only: UnixNano of the most recent recall (RecallMemories, or SearchMemories with reinforce); 0 if never recalled; ignored on write
	int32                                  recall_count              = 8;  // read-only: number of times the memory has been recalled; ignored on write
	bool                                   is_summary                = 9;  // read-only: true for the summary memory created by ReplaceMemoriesWithSummary; not updatable via UpdateMemory
	string                                 group                     = 10; // optional freeform grouping/context label (system, subsystem, owner, ...); max 128 characters
	SignificancePlacement                  placement                 = 11; // write-only: rank relative to existing values (see SignificancePlacement)
	repeated Link                          links                     = 12; // associative links this memory declares, weighted into its value (see consolidation.linkSignificanceWeight). Outbound only - Link is a directed edge from the item carrying it, so this lists exactly the edges this memory owns and an export/import round trip reproduces them once each; ask GetMemoryLinks for both directions. Write-only on StoreMemory (targets must already exist) and populated on read only when requested; use LinkMemories/UnlinkMemories to edit them incrementally
	int64                                  link_significance         = 13; // read-only: sum of this memory's links' significance values, inbound and outbound, calculated by the server; ignored on write
	map<string, string>                    metadata                  = 14; // optional multi-dimensional classification (source=slack, project=..., author=...), where group is the single freeform label. Keys match [A-Za-z0-9][A-Za-z0-9._:/-]{0,63}; values are any UTF-8 up to 512 bytes; at most 32 keys and 4096 bytes of serialised JSON in total, and those bytes count toward memory.limit.sizeBytes alongside the body. On UpdateMemory a non-empty map REPLACES the stored map wholesale - there is no per-key merge, and an absent or empty map leaves it untouched (use clear_metadata to remove it). Opaque to the server: filterable via GetMemories/SearchMemories, never interpreted, and never emitted as a metric, span, or log attribute
	bool                                   clear_metadata            = 15; // write-only: on UpdateMemory, remove all metadata. Exists because the map's own emptiness cannot say it - an absent map and an explicitly empty one are the same on the wire, and every other updatable field reads unset as "leave unchanged". Ignored on StoreMemory; takes precedence over any metadata supplied alongside it
	bool                                   clear_group               = 16; // write-only: on UpdateMemory, reset group to empty, for the same reason clear_metadata exists - an empty group string otherwise means "leave unchanged". Ignored on StoreMemory; takes precedence over any group supplied alongside it
}

// StoreEventResponse carries the stored event's id and how many of its nested memories were
// retained. An event whose significance is below event.minimumSignificance is quietly forgotten,
// like a brain that simply does not retain the insignificant: no error is returned, id is empty,
// memory_count is 0 (its nested memories are not stored either), and rejected is true.
//
// Nested-memory creation is best-effort: the event is committed first, so a nested memory that
// fails validation, is dropped for insignificance, or hits a store error does not fail the event
// create and is not individually reported here - memory_count is only the count actually retained.
// Store memories individually if you need per-memory success/failure.
message StoreEventResponse {
	string                                 id                        = 1; // the stored event's id; empty when the event was not retained
	int32                                  memory_count              = 2; // nested memories retained (best-effort; those rejected/dropped are not reported individually)
	bool                                   rejected                  = 3; // true when the event was dropped for significance below event.minimumSignificance
}

message EndEventRequest {
	string                                 id                        = 1; // the event to end
	int64                                  time_end                  = 2; // UnixNano; 0 (the default) uses the current server time
}

message UpdateEventSignificanceRequest {
	string                                 id                        = 1; // the event to update
	int32                                  significance              = 2; // the new absolute significance; must be >= 1 to take effect. IMPORTANT: 0 with no placement is a no-op - it leaves the event's existing significance unchanged; there is no way to reset an event to unranked via this RPC
	SignificancePlacement                  placement                 = 3; // write-only: rank relative to existing values (see SignificancePlacement); takes precedence over significance when set
}

message MergeEventsRequest {
	string                                 merge_to                  = 1; // the surviving event; must already exist
	string                                 merge_from                = 2; // the event whose memories are moved to merge_to; need not exist - an absent one simply matches no memories
}

message DeleteEventRequest {
	string                                 id                        = 1;
	bool                                   memories                  = 2; // true also deletes the event's memories; false only detaches them
}

message GetEventByIdRequest {
	string                                 id                        = 1; // the event to fetch
	bool                                   memories                  = 2; // true also loads the event's memories into the response
}

message GetEventResponse {
	Event                                  event                     = 1;
}

message GetEventsRequest {
	int64                                  time_start_min            = 1;  // UnixNano inclusive lower bound on time_start; 0 (the default) means no lower bound
	int64                                  time_start_max            = 2;  // UnixNano inclusive upper bound on time_start; 0 (the default) means no upper bound
	int64                                  time_end_min              = 3;  // UnixNano inclusive lower bound on time_end; 0 (the default) means no lower bound
	int64                                  time_end_max              = 4;  // UnixNano inclusive upper bound on time_end; 0 (the default) means no upper bound
	int32                                  significance_min          = 5;  // inclusive lower bound on significance; 0 (the default) means no bound, NOT a literal significance-of-zero filter
	int32                                  significance_max          = 6;  // inclusive upper bound on significance; 0 (the default) means no bound, NOT a literal significance-of-zero filter
	bool                                   memories                  = 7;  // when true, include each matching event's memories in the response
	string                                 group                     = 8;  // optional: restrict to events carrying this group label
	string                                 order_by                  = 9;  // "significance" (significance desc, then time desc) or "timestamp" (time desc); defaults to significance
	int32                                  limit                     = 10; // page size; a value <= 0 selects the server default (25); values above the server cap (200) are silently clamped down to it
	int32                                  offset                    = 11; // rows to skip for pagination; negative values are clamped to 0; no upper bound
	SignificanceExtremum                   significance_extremum     = 12; // when set, ignore significance_min/significance_max and return only events tied at that significance value among the other filters (time range, group, metadata) - not a range; 0 (default) applies no extremum
	repeated string                        metadata                  = 13; // optional: restrict to events whose metadata carries every one of these "key=value" pairs (AND, exact match), exactly as GetMemoriesRequest.metadata
}

message GetEventsResponse {
	repeated Event                         events                    = 1;
	int32                                  total_count               = 2; // events matching the filter, ignoring limit/offset — for pagination
}

message GetMemoriesRequest {
	int64                                  timestamp_min             = 1; // UnixNano inclusive lower bound on time_stamp; 0 (the default) means no lower bound
	int64                                  timestamp_max             = 2; // UnixNano inclusive upper bound on time_stamp; 0 (the default) means no upper bound
	int32                                  significance_min          = 3; // inclusive lower bound on significance; 0 (the default) means no bound, NOT a literal significance-of-zero filter
	int32                                  significance_max          = 4; // inclusive upper bound on significance; 0 (the default) means no bound, NOT a literal significance-of-zero filter
	string                                 group                     = 5; // optional: restrict to memories carrying this group label
	string                                 order_by                  = 6; // "significance" (significance desc, then time desc) or "timestamp" (time desc); defaults to significance
	int32                                  limit                     = 7; // page size; a value <= 0 selects the server default (25); values above the server cap (200) are silently clamped down to it
	int32                                  offset                    = 8; // rows to skip for pagination; negative values are clamped to 0; no upper bound
	SignificanceExtremum                   significance_extremum     = 9; // when set, ignore significance_min/significance_max and return only memories tied at that significance value among the other filters (time range, group, metadata, recall state) - not a range; 0 (default) applies no extremum
	string                                 linked_to                 = 10; // optional: restrict to memories linked to this memory id, in either direction (one hop). NotFound if that memory does not exist
	bool                                   links                     = 11; // when true, populate each returned memory's links
	repeated string                        metadata                  = 12; // optional: restrict to memories whose metadata carries every one of these "key=value" pairs (AND, exact match). Split on the FIRST '=', so a value may itself contain '='; the key must match the metadata key charset. A repeated string rather than a map because a map cannot be bound from a URL query string - over HTTP this is ?metadata=source%3Dslack&metadata=project%3Dx. Unindexed, exactly as the group filter is
	Bool                                   recalled                  = 13; // optional: FALSE returns only never-recalled memories (recall_count = 0), TRUE only those recalled at least once; UNSPECIFIED (default) applies no restriction. This is what answers "what have I never recalled?" - recall_count_max cannot, because 0 there means no bound
	int32                                  recall_count_min          = 14; // inclusive lower bound on recall_count; 0 (the default) means no bound, NOT a literal never-recalled filter - use recalled for that
	int32                                  recall_count_max          = 15; // inclusive upper bound on recall_count; 0 (the default) means no bound, NOT a literal never-recalled filter - use recalled for that
	int64                                  time_recalled_min         = 16; // UnixNano inclusive lower bound on time_recalled; 0 (the default) means no lower bound. Both bounds ask only about memories that HAVE been recalled - see time_recalled_max
	int64                                  time_recalled_max         = 17; // UnixNano inclusive upper bound on time_recalled; 0 (the default) means no upper bound. Never-recalled memories are excluded rather than matched: their time_recalled is 0, so "recalled before X" would otherwise return every memory that was never recalled at all. Use recalled to ask about those
	Bool                                   is_summary                = 18; // optional: TRUE returns only summary memories (see ReplaceMemoriesWithSummary), FALSE only non-summaries; UNSPECIFIED (default) applies no restriction
	Bool                                   is_binary                 = 19; // optional: TRUE returns only binary memories, FALSE only non-binary; UNSPECIFIED (default) applies no restriction
	string                                 event_id                  = 20; // optional: restrict to memories associated with this event. This is the paged way to read an event's memories - GetEventById with memories: true returns them all in one message, which overruns the receive frame on a large event. Empty (the default) applies no restriction rather than matching the event-less; use has_event for those
	Bool                                   has_event                 = 21; // optional: FALSE returns only memories associated with no event, TRUE only those associated with one; UNSPECIFIED (default) applies no restriction. Exists because event_id cannot say it - an event-less memory stores an empty event_id, which is the same value that means "no bound" there, exactly as recalled exists alongside recall_count_min/max
}

message GetMemoriesResponse {
	repeated Memory                        memories                  = 1;
	int32                                  total_count               = 2; // memories matching the filter, ignoring limit/offset — for pagination
}

// StoreMemoryResponse carries the stored memory's id. A memory whose significance is below
// memory.minimumSignificance is quietly forgotten, like a brain that simply does not retain the
// insignificant: no error is returned, id is empty, and rejected is true.
message StoreMemoryResponse {
	string                                 id                        = 1; // the stored memory's id; empty when the memory was not retained
	bool                                   rejected                  = 2; // true when the memory was dropped for significance below memory.minimumSignificance
}

message DeleteMemoriesRequest {
	repeated string                        ids                       = 1;
}

message RecallMemoriesRequest {
	repeated string                        ids                       = 1;
	bool                                   include_linked            = 2; // also return the memories linked to those recalled, one hop, in either direction. The linked memories are returned as an associative recall, not counted as directly recalled: their recall_count is untouched (see consolidation.linkRecallPropagation for what a recall does to a neighbour's decay clock)
}

// SearchMode selects how a search decides which memories match.
//
// Not every mode is available in every deployment, and which are is a property of the deployment
// rather than of the caller: KEYWORD needs a content-search backend (built in on the sqlite driver,
// OpenSearch otherwise), while SEMANTIC and HYBRID additionally need an embedding model and
// OpenSearch's vector index. An unavailable mode is rejected with FAILED_PRECONDITION naming what
// is missing; WhoAmI reports the available modes so a client can choose without probing.
enum SearchMode {
	SEARCH_MODE_UNSPECIFIED                                          = 0; // treated as KEYWORD, so an existing caller's behaviour is unchanged
	SEARCH_MODE_KEYWORD                                              = 1; // match on the words in the body; exact terms, error codes, and identifiers
	SEARCH_MODE_SEMANTIC                                             = 2; // match on meaning via embeddings; finds paraphrase the words would miss
	SEARCH_MODE_HYBRID                                               = 3; // both, their rankings fused; usually the best of the three
}

// SearchMemoriesRequest queries the secondary content-search index for memories matching the
// query. Results are always re-read from the primary store, which remains authoritative; ids the
// index returns that the primary store no longer holds are silently dropped. When reinforce is
// true the matched memories are recalled - resetting their decay clocks and raising their
// effective significance - rather than merely fetched, and only the memories actually returned are
// reinforced.
message SearchMemoriesRequest {
	string                                 query                     = 1;
	int32                                  limit                     = 2; // maximum results; a value <= 0 selects the default (10)
	string                                 event_id                  = 3; // optional: restrict matches to a single event
	bool                                   reinforce                 = 4; // route matches through recall, reinforcing them
	string                                 group                     = 5; // optional: restrict matches to memories carrying this group label
	SearchMode                             mode                      = 6; // how to match; unset means KEYWORD
	bool                                   include_linked            = 7; // also return the memories linked to each match, one hop, in either direction; appended after the ranked matches and never counted as matches themselves
	repeated string                        metadata                  = 8; // optional: restrict matches to memories whose metadata carries every one of these "key=value" pairs (AND, exact match), exactly as GetMemoriesRequest.metadata. Applied inside the search index rather than to the results, so it narrows the candidates that ranking sees and limit still means what it says
}

// LinkDirection narrows which of an item's links a read returns. The graph is stored directed, so
// the two directions are distinguishable, but value is symmetric - both ends of a link gain its
// significance - which is why BOTH is the default rather than OUTBOUND.
enum LinkDirection {
	LINK_DIRECTION_UNSPECIFIED                                       = 0; // treated as BOTH
	LINK_DIRECTION_BOTH                                              = 1; // links in either direction
	LINK_DIRECTION_OUTBOUND                                          = 2; // only links this item declared, pointing away from it
	LINK_DIRECTION_INBOUND                                           = 3; // only links other items declared, pointing at it
}

// LinkMemoriesRequest adds or updates links from one memory to others. It is an upsert per pair:
// re-linking an existing pair overwrites that link's significance rather than creating a duplicate.
message LinkMemoriesRequest {
	string                                 id                        = 1; // the memory the links start from; must exist
	repeated Link                          links                     = 2; // the targets and their significances; each target must exist and must not be id itself
}

message UnlinkMemoriesRequest {
	string                                 id                        = 1; // the memory the links start from; must exist
	repeated string                        ids                       = 2; // targets to unlink; unknown ids are silently ignored. Removes links in either direction between id and each target
}

message GetMemoryLinksRequest {
	string                                 id                        = 1; // the memory whose links to return; must exist
	LinkDirection                          direction                 = 2; // which directions to return; unset means BOTH
}

message LinkEventsRequest {
	string                                 id                        = 1; // the event the links start from; must exist
	repeated Link                          links                     = 2; // the targets and their significances; each target must exist and must not be id itself
}

message UnlinkEventsRequest {
	string                                 id                        = 1; // the event the links start from; must exist
	repeated string                        ids                       = 2; // targets to unlink; unknown ids are silently ignored. Removes links in either direction between id and each target
}

message GetEventLinksRequest {
	string                                 id                        = 1; // the event whose links to return; must exist
	LinkDirection                          direction                 = 2; // which directions to return; unset means BOTH
}

// LinkEdge is one stored link as read back: the pair it connects, its significance, and which way
// it points relative to the item that was asked about. Link (the write form) names only the far
// end, because the near end is the item carrying it; a read can return both directions at once and
// so has to say which is which.
message LinkEdge {
	string                                 id                        = 1; // the far end's id - the other memory or event
	int32                                  significance              = 2; // this link's weight
	LinkDirection                          direction                 = 3; // OUTBOUND when the queried item declared this link, INBOUND when the far end did
	int64                                  created                   = 4; // UnixNano the link was first created
}

message GetLinksResponse {
	repeated LinkEdge                      links                     = 1;
	int64                                  link_significance         = 2; // the queried item's total link significance, both directions - the figure the decay maths damps and weights
}

// ReplaceMemoriesWithSummaryRequest asks the service to delete every memory associated with an
// event and replace them with a single caller-supplied summary memory. The service has no
// visibility into memory content, so it cannot generate the summary itself.
message ReplaceMemoriesWithSummaryRequest {
	string                                 event_id                  = 1;
	Memory                                 summary                   = 2;
}

message ReplaceMemoriesWithSummaryResponse {
	string                                 id                        = 1;
	int32                                  memories_replaced         = 2;
}

// SummarisationCandidate identifies an event whose memories have accumulated enough, and gone
// quiet for long enough, to be worth condensing into a single summary memory via
// ReplaceMemoriesWithSummary.
message SummarisationCandidate {
	string                                 event_id                  = 1;
	string                                 event_name                = 2;
	int32                                  memory_count              = 3;
}

message GetSummarisationCandidatesResponse {
	repeated SummarisationCandidate         candidates               = 1;
}

// SummariseMemoriesRequest asks the service to generate a summary of an event's memories with the
// embedded LLM (ollama.enabled) and replace them with it in one transaction, like
// ReplaceMemoriesWithSummary but with the service authoring the summary. Binary memories are
// excluded from the LLM prompt (their bodies are opaque, not text).
message SummariseMemoriesRequest {
	string                                 event_id                  = 1;
	int32                                  significance              = 2; // optional: significance for the resulting summary memory; 0 (and no placement) defaults to the highest significance among the replaced memories
	SignificancePlacement                  placement                 = 3; // optional: rank the summary relative to existing values (see SignificancePlacement); takes precedence over significance when set
}

message SummariseMemoriesResponse {
	string                                 id                        = 1; // the new summary memory's id
	int32                                  memories_replaced         = 2; // how many memories the summary replaced
	string                                 summary                   = 3; // the LLM-generated summary text stored in the new memory
}

// ArchiveHeader is the first record of an export archive: a gzip-compressed stream of
// length-delimited ArchiveRecord messages.
message ArchiveHeader {
	int32                                  version                   = 1;
	int64                                  exported_at               = 2; // UnixNano
	int32                                  event_count               = 3;
	int32                                  memory_count              = 4;
}

message ArchiveRecord {
	oneof record {
		ArchiveHeader                          header                   = 1;
		Event                                  event                    = 2;
		Memory                                 memory                   = 3;
	}
}

// ImportBatchRequest carries full-state rows (original timestamps, recall state, significance,
// group, event links) to be upserted by id into the store as-is - a data migration, not a fresh
// write. It is the ingest half of Transfer and is re-sendable: re-importing the same rows is
// idempotent.
message ImportBatchRequest {
	repeated Event                         events                    = 1;
	repeated Memory                        memories                  = 2;
}

message ImportBatchResponse {
	int32                                  events_imported           = 1;
	int32                                  memories_imported         = 2;
}

// Export snapshots every event and memory into an archive object in S3 and records a manifest of
// exactly what was captured; with clear set, the captured records are deleted after a successful
// upload (writes and recalls landing mid-run survive, exactly as Clear does).
message ExportRequest {
	bool                                   clear                     = 1;
}

message ExportResponse {
	string                                 manifest_id               = 1;
	string                                 object_key                = 2;
	int32                                  events_exported           = 3;
	int32                                  memories_exported         = 4;
	int32                                  memories_cleared          = 5;
	int32                                  events_cleared            = 6;
}

message ImportRequest {
	string                                 object_key                = 1;
}

message ImportResponse {
	int32                                  events_imported           = 1;
	int32                                  memories_imported         = 2;
}

// Transfer streams every event and memory directly to a centralised instance's ImportBatch RPC
// (address from transfer.targetAddress); like Export it records a manifest, and with clear set
// deletes the captured records once the target has accepted them all.
message TransferRequest {
	bool                                   clear                     = 1;
}

message TransferResponse {
	string                                 manifest_id               = 1;
	int32                                  events_transferred        = 2;
	int32                                  memories_transferred      = 3;
	int32                                  memories_cleared          = 4;
	int32                                  events_cleared            = 5;
}

// Clear deletes exactly the records captured by the Export/Transfer run that produced the
// manifest: memories are deleted only if neither created nor recalled since the snapshot, and
// events only once they have no memories left. Manifests are held in memory - a restart discards
// them.
message ClearRequest {
	string                                 manifest_id               = 1;
}

message ClearResponse {
	int32                                  memories_cleared          = 1;
	int32                                  events_cleared            = 2;
}

message GeneralResponse {
	bool                                   ok                        = 1;
}

// ForgetRule names why a memory appears in a consolidation preview - which of the two independent
// deletion paths selected it. The distinction matters when tuning: a memory forgotten by
// CONSOLIDATION decayed below the threshold and is answered by the decay settings
// (aggressiveness, deletionThreshold, unitsOfAgeInDays), while one forgotten by EVICTION was
// still valuable enough to keep and went only because the store is over its byte capacity - which
// is answered by capacityBytes, or by storing less.
enum ForgetRule {
	FORGET_RULE_UNSPECIFIED                                          = 0;
	FORGET_RULE_CONSOLIDATION                                        = 1; // decayed value fell below the capacity-pressure-scaled deletion threshold
	FORGET_RULE_EVICTION                                             = 2; // still above the threshold, but evicted to bring the store back under its byte capacity
}

// PreviewConsolidationRequest asks what a consolidation cycle would forget. limit bounds only the
// sample of individual memories returned - every count in the response is complete regardless, so
// a truncated sample never understates how much would be forgotten.
message PreviewConsolidationRequest {
	int32                                  limit                     = 1; // memories to detail; <= 0 selects the default (100), values above the cap (1000) are clamped down to it
}

// ForgetCandidate is one memory a cycle would delete, with the numbers behind the decision. value
// and threshold are the two sides of the comparison that decided it: a CONSOLIDATION candidate is
// one whose value fell below the threshold. Bodies are never included - a preview reports what
// would be lost, it is not a way to read the store.
message ForgetCandidate {
	string                                 id                        = 1;
	string                                 event_id                  = 2;  // empty for a memory with no event
	string                                 group                     = 3;
	int32                                  significance              = 4;  // the memory's stored significance, as ranked
	double                                 value                     = 5;  // the computed decayed value that decided it (see docs/consolidation.md)
	double                                 threshold                 = 6;  // the capacity-pressure-scaled deletion threshold value was compared against
	int64                                  body_bytes                = 7;  // stored size of the body, after compression - the same measure capacity accounting uses
	ForgetRule                             rule                      = 8;
	int64                                  time_stamp                = 9;  // UnixNano
	int64                                  time_recalled             = 10; // UnixNano of the most recent recall; 0 if never recalled
	int32                                  recall_count              = 11;
}

// PreviewConsolidationResponse reports what a cycle would forget. The counts and byte figures are
// always complete; candidates is a bounded sample of the individual memories, ordered by value
// ascending so the least valuable - those furthest past the threshold - come first.
//
// The preview accounts for the cycle's own ordering: consolidation runs first, so the memories it
// would delete are excluded from the eviction pool and their bytes are already reclaimed before
// eviction is considered at all. A memory therefore appears at most once, under the rule that
// would actually claim it.
message PreviewConsolidationResponse {
	int32                                  memories_consolidated     = 1;  // memories whose value fell below the threshold
	int32                                  memories_evicted          = 2;  // memories capacity eviction would additionally delete
	int32                                  events_deleted            = 3;  // events that would go: those left with no memories, plus empty events past their own threshold
	int64                                  bytes_freed               = 4;  // estimated bytes reclaimed by both paths together, on the same basis as used_bytes

	// memories_retained counts the memories that would otherwise have been forgotten but are held
	// by consolidation.minimumRetentionInDays, with retained_bytes their stored size. Watch this
	// against capacity_bytes: retention overrides the capacity target, so once retained_bytes
	// approaches capacity_bytes the store cannot be brought back under its target however hard
	// eviction runs. They are counted, never listed - on a healthy store almost everything is
	// retained, so listing them would return the store.
	int32                                  memories_retained         = 5;
	int64                                  retained_bytes            = 6;

	// The decision inputs as they stood for this preview, so the numbers above can be read against
	// the configuration that produced them.
	double                                 capacity_pressure         = 7;  // multiplier applied to the deletion threshold by how full the store is (1.0 = no effect)
	double                                 deletion_threshold        = 8;  // the scaled threshold actually applied: deletionThreshold * capacity_pressure
	int64                                  used_bytes                = 9;  // the store's current used bytes
	int64                                  capacity_bytes            = 10; // consolidation.capacityBytes; 0 when no byte capacity is configured, in which case eviction never runs

	repeated ForgetCandidate               candidates                = 11;
	bool                                   truncated                 = 12; // true when more memories would be forgotten than limit returned
}

// DecayCurveRequest asks for the curve the configured decay algorithm produces for one significance
// value, so a client can plot it without reimplementing the maths (which is what
// docs/consolidation.md's value tables describe, and what the config wizard's preview approximates).
// Leaving the field unset asks for no curve.
message DecayCurveRequest {
	double                                 significance              = 1; // the combined significance to project; must be > 0 - pass a memory's effective_significance to plot that memory's own curve
	double                                 max_age_days              = 2; // the span to project over; <= 0 asks the server to choose a span that shows the threshold crossing
	int32                                  points                    = 3; // samples to return; <= 0 selects the default (60), values above the cap (500) are clamped down to it
}

// DecayPoint is one sample of a decay curve: the value the configured algorithm gives an item of the
// requested significance once its decay clock reads age_days.
message DecayPoint {
	double                                 age_days                  = 1;
	double                                 value                     = 2;
}

// DecayCurve is the projected decay of one significance value under the current configuration,
// sampled evenly from just after age zero to max_age_days. It is computed by the same code that
// decides consolidation, so a plot of it cannot drift from what the service will actually do.
message DecayCurve {
	double                                 significance              = 1; // the combined significance projected, echoed back
	double                                 max_age_days              = 2; // the span actually projected over, whether requested or chosen by the server
	double                                 crossing_age_days         = 3; // the age at which the curve falls below deletion_threshold; -1 when it does not within the projected span
	repeated DecayPoint                    points                    = 4;
}

// MemoryValuation is where one memory stands against the consolidation rules right now: the value
// the decay algorithm gives it, the threshold that value is measured against, and the flags that
// override the comparison either way. Bodies are never included - this explains a memory, it is not
// a way to read one.
message MemoryValuation {
	string                                 id                        = 1;
	string                                 event_id                  = 2;  // empty for a memory with no event (or one whose event no longer exists)
	int32                                  significance              = 3;  // the memory's own stored significance, as ranked
	double                                 effective_significance    = 4;  // what the decay actually acts on: the memory's own significance plus its event's, the damped link contributions below, and the weighted recall count
	double                                 value                     = 5;  // the computed decayed value (see docs/consolidation.md)
	double                                 threshold                 = 6;  // the capacity-pressure-scaled deletion threshold value is compared against
	double                                 age_days                  = 7;  // days since the memory's decay clock last reset - its creation, or its most recent recall
	int32                                  recall_count              = 8;
	int64                                  time_recalled             = 9;  // UnixNano of the most recent recall; 0 if never recalled
	bool                                   would_consolidate         = 10; // a cycle running now would forget this memory
	bool                                   retained                  = 11; // held by consolidation.minimumRetentionInDays, so neither consolidation nor capacity eviction may take it
	bool                                   below_minimum_age         = 12; // younger than consolidation.minimumAgeInDays, so value-based consolidation is deferred whatever the value says
	double                                 days_until_forgotten      = 13; // projected days until the memory would be consolidated, holding today's threshold and pressure and assuming no further recall; 0 when it is already due, -1 when it is not due within the projected horizon
	int64                                  link_significance         = 14; // the memory's own summed link significance, both directions, before damping
	double                                 link_contribution         = 15; // what those links add to effective_significance: linkSignificanceWeight * log1p(link_significance)
	int64                                  event_link_significance   = 16; // the memory's event's summed link significance, both directions, before damping; 0 for a memory with no event
	double                                 event_link_contribution   = 17; // what the event's links add to effective_significance, damped the same way; 0 for a memory with no event
}

// ExplainConsolidationRequest asks where the named memories stand against the consolidation rules,
// and optionally for the decay curve of the current configuration. Both parts are optional: ids
// without a curve values just those memories, a curve without ids reports the configuration and the
// current capacity pressure alone. Ids that do not exist are simply absent from the response.
message ExplainConsolidationRequest {
	repeated string                        memory_ids                = 1; // the memories to value; at most 200 per call
	DecayCurveRequest                      curve                     = 2; // optional projected curve for the current configuration
}

// ExplainConsolidationResponse carries the decision inputs, one valuation per memory found, and the
// requested curve. The inputs are a snapshot: capacity pressure and used bytes are re-read
// periodically rather than per call, so they may lag a cycle that has just run - by design, since
// this is asked far more often than a preview and both readings cost a scan.
message ExplainConsolidationResponse {
	double                                 capacity_pressure         = 1;  // multiplier applied to the deletion threshold by how full the store is (1.0 = no effect)
	double                                 deletion_threshold        = 2;  // the scaled threshold actually applied: deletionThreshold * capacity_pressure
	int64                                  used_bytes                = 3;  // the store's current used bytes
	int64                                  capacity_bytes            = 4;  // consolidation.capacityBytes; 0 when no byte capacity is configured
	int32                                  memory_count              = 5;  // memories currently stored - the other axis capacity pressure rides on
	int32                                  capacity_memories         = 6;  // consolidation.capacityMemories; 0 when no row capacity is configured

	// The configured decay policy, so a client can label what it is showing without a second source
	// of truth for it.
	int32                                  method                    = 7;  // consolidation.method (1-6; see docs/consolidation.md)
	double                                 aggressiveness            = 8;
	double                                 units_of_age_in_days      = 9;  // days per unit of age fed to the decay algorithm
	int32                                  minimum_age_in_days       = 10;
	int32                                  minimum_retention_in_days = 11;

	repeated MemoryValuation               valuations                = 12;
	DecayCurve                             curve                     = 13; // absent when none was requested
}

// WhoAmIResponse reports the caller's identity to a client so it can tailor its UI. role is the
// caller's effective authorization tier ("reader", "writer", or "admin"); auth_enabled is false
// when the service runs without authentication, in which case role is "admin" (unrestricted) and
// client_id is empty.
message WhoAmIResponse {
	string                                 client_id                 = 1;
	string                                 role                      = 2;
	bool                                   auth_enabled              = 3;

	// search_modes lists the SearchMemories modes this deployment can serve, so a client can adapt
	// rather than discover an unavailable mode by having a search rejected. It depends on the
	// storage driver and on whether OpenSearch and an embedding model are configured - never on the
	// caller - so it is the same for every caller of a given instance. An empty list means content
	// search is unavailable entirely and SearchMemories is rejected in every mode.
	repeated SearchMode                    search_modes              = 4;

	// groups is the caller's group scope: the group labels whose records this token may read and
	// write. Empty means unscoped - the whole store - which is what every token is unless the
	// deployment issues scoped ones, so a client must read group_scoped rather than infer from the
	// list being empty.
	repeated string                        groups                    = 5;

	// group_scoped reports whether a scope is in force for this caller. It exists because an empty
	// groups list is ambiguous on its own and the two readings are opposites: unscoped (see
	// everything) versus scoped to nothing. A client showing "you can see N groups" must branch on
	// this, not on len(groups).
	//
	// When true, writes are stamped with the caller's group, Purge/Sleep/PreviewConsolidation are
	// refused, and records outside the scope report NotFound - so a console can explain an empty
	// store rather than leave it looking like data loss.
	bool                                   group_scoped              = 6;
}

message EmptyRequest {}
