# Hippocampus alert rules, in Prometheus rule-file format.
#
# Load it from a Prometheus configuration:
#
#   rule_files:
#     - /etc/prometheus/hippocampus-alerts.yaml
#
# ...or lift the `groups:` block below into the `spec:` of a prometheus-operator PrometheusRule,
# or into a Mimir/Grafana Cloud rule group (`mimirtool rules load`). Nothing here is
# deployment-specific.
#
# The same rules are provisioned as Grafana-managed rules for the bundled otel-lgtm stack in
# deploy/compose/observability/alerting-rules.yaml. The two files carry byte-identical PromQL and
# `for:` durations, and cmd/hippocampus/alerts_test.go fails if they drift - or if either names a
# metric no instrument in this repo declares.
#
# There are two groups. `hippocampus` is the service itself. `hippocampus-clients` is the components
# that dial it - the broker bridges and the ingestor - which are separate processes publishing their
# own metrics: a deployment running none of them produces none of those series, and every rule in
# that group stays silent rather than firing on the absence.
#
# Metric names are the Prometheus rendering of the OTLP instruments (dots become underscores, a
# counter gains `_total`, a histogram in seconds gains `_seconds_bucket`); see
# docs/operations.md#observability for what each one measures.
#
# Two things to adjust before using these as-is:
#
#   * Thresholds are starting points, not universal truths. In particular the latency budget in
#     HippocampusRequestLatencyHigh and the ratio in HippocampusServerErrorRateHigh are whatever
#     your SLO says they are.
#   * Every expression aggregates over the whole datasource, which is right for the one-instance-
#     per-store deployment model (docs/operations.md#deployment-model-one-consolidating-instance-per-store).
#     If one Prometheus holds several Hippocampus deployments, add `by (job)` - or a matcher on
#     whatever label separates them - to each expression, or an alert on one deployment will be
#     diluted by the others' healthy traffic.

groups:
  - name: hippocampus
    interval: 1m
    rules:
      # --- Requests (RED) -------------------------------------------------------------------

      # Alerting on server_error alone is the whole reason `outcome` is three-valued rather than a
      # success bool: a client sending malformed or unauthorised requests is not the service
      # failing, and an SLO that cannot tell the two apart pages on traffic the operator cannot
      # fix. The denominator is clamped so that no traffic at all reads as a 0 ratio rather than
      # NaN.
      - alert: HippocampusServerErrorRateHigh
        expr: sum(rate(hippocampus_rpc_requests_total{outcome="server_error"}[5m])) / clamp_min(sum(rate(hippocampus_rpc_requests_total[5m])), 0.001) > 0.01
        for: 10m
        labels:
          severity: critical
          service: hippocampus
        annotations:
          summary: "Hippocampus is failing more than 1% of requests"
          description: "Over 1% of RPCs are returning a server-fault code across both transports. Client faults (bad arguments, missing ids, rejected tokens) are excluded, so this is the service itself. Break it down by rpc and code on the Hippocampus dashboard's Failures by RPC and code panel, then check the service logs - a failing RPC logs at Warn with its method, code, and error."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#request-metrics-red"

      # Deliberately excludes the RPCs that are legitimately long-running: a sleep cycle, a purge,
      # and the bulk data-movement calls all scale with the store, so including them would make the
      # quantile a measure of store size rather than of service health. A new long-running RPC
      # needs adding to this matcher.
      #
      # This expression depends on hippocampus.rpc.duration carrying the EXPLICIT bucket boundaries
      # in observability/histogram.go. The instrument records seconds and the OTel SDK's default
      # boundaries are millisecond-shaped, so without them every observation lands in one 0-5s
      # bucket and this p95 interpolates to ~4.75s regardless of the real latency - which is to say
      # this alert fired permanently, on every deployment with traffic, until 2026-08-29.
      # cmd/hippocampus/rpcbuckets_test.go is what holds the two together.
      - alert: HippocampusRequestLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(hippocampus_rpc_duration_seconds_bucket{rpc!~"Sleep|Purge|Export|Import|ImportBatch|Transfer|Clear|PreviewConsolidation|SummariseMemories"}[5m]))) > 1
        for: 15m
        labels:
          severity: warning
          service: hippocampus
        annotations:
          summary: "Hippocampus p95 request latency is above 1s"
          description: "The 95th percentile of the interactive RPCs (long-running admin and bulk-transfer calls are excluded) has been above one second. On the server drivers check the connection pool and storage.queryTimeoutSeconds; on sqlite check whether a sleep cycle or a preview is contending for the single connection. The dashboard's p95 duration by RPC panel names the call."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#request-metrics-red"

      # --- Forgetting ----------------------------------------------------------------------

      # Consolidation is the only thing that bounds the store. A run of failing cycles means
      # nothing is being forgotten, so the store grows until it hits its disk or capacity limit.
      - alert: HippocampusSleepCycleFailing
        expr: sum(rate(hippocampus_sleeps_total{success="false"}[15m])) > 0
        for: 15m
        labels:
          severity: critical
          service: hippocampus
        annotations:
          summary: "Hippocampus sleep cycles are failing"
          description: "Consolidation has been failing for at least 15 minutes, so nothing is being forgotten and the store is now unbounded. The cycle logs the failing pass; the usual causes are a database error, a store made unreachable mid-cycle, or a cycle exceeding storage.queryTimeoutSeconds on a store that has outgrown it."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#observability"

      # A process that has exited publishes nothing, so this asks the opposite question to the rule
      # above: not "did a cycle fail" but "has any cycle succeeded at all". It is what catches the
      # instance-lock keepalive exiting the consolidator (docs/operations.md#the-instance-lock-keepalive-server-drivers),
      # a crash loop, and a deployment where every instance was left with consolidation.enabled:
      # false. Absence is expressed in PromQL rather than left to the alerting engine's no-data
      # policy, so Prometheus and Grafana behave identically.
      #
      # The 1h window must stay comfortably above sleep.periodSeconds, or a slow cycle reads as an
      # absent one.
      - alert: HippocampusConsolidatorAbsent
        expr: absent_over_time(hippocampus_sleeps_total{success="true"}[1h])
        for: 15m
        labels:
          severity: critical
          service: hippocampus
        annotations:
          summary: "No Hippocampus instance has completed a sleep cycle in an hour"
          description: "No successful consolidation has been reported for an hour, which usually means the consolidating instance is gone rather than slow - on postgres/mysql, most often the instance-lock keepalive exiting because the lock session died. Confirm exactly one instance is running with consolidation.enabled: true, and that its sleep.periodSeconds is below this rule's window."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#the-instance-lock-keepalive-server-drivers"

      # --- Capacity ------------------------------------------------------------------------

      # The decay-only counterpart to HippocampusCapacityPressureHigh, and the reason used_bytes is
      # published without a capacity target (docs/consolidation.md, "Forgetting modes"). With both
      # capacity axes at 0 the store is bounded only by its decay settings reaching an equilibrium
      # with the write rate, capacity_pressure is flat at exactly 1.0, and every capacity rule here
      # is inert - so the question has to be asked as a comparison of rates rather than a level:
      # is the store forgetting as fast as it is being written to?
      #
      # Sustained, a no means the store will grow until the decay settings catch up, which for a
      # stationary arrival rate they eventually do and for a growing one they do not. Both sides are
      # summed so the comparison matches on no labels at all: the three counters carry different
      # attribute sets, and a bare vector match between them would silently never fire.
      #
      # The 1h windows must stay comfortably above sleep.periodSeconds - forgetting arrives in
      # per-cycle bursts, so a window near the period reads every gap between cycles as a shortfall.
      - alert: HippocampusStoreGrowing
        expr: sum(rate(hippocampus_memories_stored_total[1h])) > sum(rate(hippocampus_memories_consolidated_total[1h])) + sum(rate(hippocampus_memories_evicted_total[1h]))
        for: 6h
        labels:
          severity: warning
          service: hippocampus
        annotations:
          summary: "Hippocampus is storing faster than it is forgetting"
          description: "Memories have been arriving faster than consolidation and eviction remove them for six hours, so the store is growing. On a decay-only deployment (no consolidation.capacityBytes or capacityMemories) that is the only signal there is, since capacity pressure cannot rise - either the decay settings are too weak for the write rate (raise consolidation.deletionThreshold or aggressiveness, or lower unitsOfAgeInDays), or set a capacity target if the store's size needs a bound rather than an equilibrium. Watch hippocampus_used_bytes for the trend."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#decay-only-no-capacity-target-at-all"


      # capacity_pressure is 1 + utilisation^capacityPressureExponent, and exactly 1.0 when no
      # capacity target is configured - so this cannot fire on a deployment that has set none. At
      # the default exponent of 1, 1.9 is 90% of the target.
      - alert: HippocampusCapacityPressureHigh
        expr: max(hippocampus_capacity_pressure) > 1.9
        for: 30m
        labels:
          severity: warning
          service: hippocampus
        annotations:
          summary: "Hippocampus is running near its capacity target"
          description: "Capacity pressure has been sustained near or above the configured target, so the decay threshold is being scaled up and memories are being forgotten sooner than the decay settings alone would forget them. Either raise consolidation.capacityBytes/capacityMemories, or accept the shorter retention. Note that the threshold maps to a different utilisation if consolidation.capacityPressureExponent is not 1."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#observability"

      # used_bytes is published in both forgetting modes, but capacity_bytes only when a byte
      # target is set, so the comparison has nothing to match against and this stays inert on a
      # decay-only store. HippocampusStoreGrowing below is that mode's counterpart.
      - alert: HippocampusStoreOverCapacity
        expr: max(hippocampus_used_bytes) > max(hippocampus_capacity_bytes)
        for: 1h
        labels:
          severity: warning
          service: hippocampus
        annotations:
          summary: "Hippocampus is above its byte capacity target"
          description: "The store has been over consolidation.capacityBytes for an hour, so eviction is running every cycle and is not winning. Either the write rate exceeds what one cycle can reclaim (shorten sleep.periodSeconds), or retention is holding the bytes down - check HippocampusRetentionNearCapacity and the retained_bytes series."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#observability"

      # The failure mode worth paging for: minimumRetentionInDays overrides the capacity target, so
      # once retained bytes reach capacity the target has become unreachable however hard eviction
      # runs. Only published when both minimumRetentionInDays and capacityBytes are set.
      - alert: HippocampusRetentionNearCapacity
        expr: max(hippocampus_retained_bytes) / clamp_min(max(hippocampus_capacity_bytes), 1) > 0.9
        for: 30m
        labels:
          severity: critical
          service: hippocampus
        annotations:
          summary: "Hippocampus retention is consuming its capacity target"
          description: "Memories inside consolidation.minimumRetentionInDays now hold over 90% of consolidation.capacityBytes. Retention overrides the capacity target, so eviction will keep running, find nothing it is allowed to delete, and the store will grow past its target until that data ages out. Shorten minimumRetentionInDays, raise capacityBytes, or reduce the ingest rate."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#observability"

      # --- Rate limiting -------------------------------------------------------------------

      # Rejections are the limit working, so this is not "something is broken" - it is "the limits
      # you set are now shaping traffic", which is a thing to know about before a caller reports it
      # as an outage. The scope attribute says which level is biting: `global` means the instance
      # ceiling (raise it, or scale out), `client` means one caller is over its share, `tier` means
      # a whole class of caller is. Silent unless rate limiting is configured, since nothing
      # publishes the counter otherwise.
      - alert: HippocampusRateLimitRejecting
        expr: sum(rate(hippocampus_ratelimit_rejected_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
          service: hippocampus
        annotations:
          summary: "Hippocampus is rejecting more than one request per second on a rate limit"
          description: "Requests are being refused with ResourceExhausted/429 by a configured rate limit. Break it down by the scope attribute to see which level is biting: global is the instance ceiling, client is one caller over its share, tier is a whole class of caller. Decide whether this is a caller to talk to or a limit to raise - and note that a global ceiling being hit affects every caller, including well-behaved ones."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#rate-limiting"

      # --- Secondary index and process health ----------------------------------------------

      # Index propagation is best-effort by design (the primary write never waits on it), so drops
      # are survivable - but a sustained drop rate means the index is going sparse and searches are
      # quietly missing memories that exist.
      - alert: HippocampusSearchIndexDropping
        expr: sum(rate(hippocampus_search_dropped_total[10m])) > 0
        for: 10m
        labels:
          severity: warning
          service: hippocampus
        annotations:
          summary: "Hippocampus is dropping search index operations"
          description: "Index operations are being dropped - the apply queue is full, or every retry against the cluster failed - so the search index is going sparse and SearchMemories will miss memories that exist in the store. Check the OpenSearch cluster's health first. The periodic reconciliation sweep heals missing documents; --backfill-search --reindex rebuilds the index outright."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#observability"

      # The delete outbox backing up. Deletions are durable once recorded, so this is backlog rather
      # than loss - but the index holds documents for forgotten memories until it drains, and a
      # backlog that never drains eventually reaches the caps below.
      - alert: HippocampusSearchOutboxBacklog
        expr: max(hippocampus_search_outbox_depth) > 10000
        for: 30m
        labels:
          severity: warning
          service: hippocampus
        annotations:
          summary: "Hippocampus cannot apply index deletions as fast as it records them"
          description: "Index deletions are being recorded in the outbox faster than they can be applied to the search index, so the index is holding documents for memories the store has already forgotten. Unlike a dropped index operation this is durable - nothing is lost, and the queue drains once the cluster keeps up - but the backlog costs disk and dilutes bm25 ranking until it does. Check the OpenSearch cluster's health. If the backlog reaches opensearch.outbox.maxRows or maxAgeHours the oldest entries are discarded to the reconciliation sweep."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#observability"

      # The callback queue's counterpart, and a harder failure than the outbox's: there is no sweep
      # behind this queue, so a delivery discarded at the caps is a notification nobody will ever
      # receive.
      - alert: HippocampusCallbackQueueBacklog
        expr: max(hippocampus_callbacks_queue_depth) > 10000
        for: 30m
        labels:
          severity: warning
          service: hippocampus
        annotations:
          summary: "Hippocampus cannot deliver callbacks as fast as it records them"
          description: "Callback deliveries are being recorded faster than the receiver at callbacks.url accepts them, so the store is holding notifications about memories it has already forgotten. Nothing is lost yet - the queue is durable and drains once the receiver keeps up - but it is excluded from the capacity target, not from the disk. Check the receiver. If the backlog reaches callbacks.maxRows or maxAgeHours the oldest deliveries are discarded, and unlike a queued index deletion nothing recovers them."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#observability"

      # The receiver is answering with something other than a 2xx, or not answering at all. Separate
      # from the backlog above because it fires first: a failing receiver shows here within minutes,
      # while the depth takes as long as the deletion rate needs to build ten thousand deliveries.
      - alert: HippocampusCallbackDeliveriesFailing
        expr: sum(rate(hippocampus_callbacks_delivered_total{outcome="failed"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
          service: hippocampus
        annotations:
          summary: "Hippocampus callback deliveries are being refused"
          description: "The receiver at callbacks.url is refusing deliveries, or is unreachable. Each failure is deferred on an exponential backoff and retried, so nothing is lost while this fires - but the queue grows for as long as it lasts, and once it reaches callbacks.maxRows or maxAgeHours the oldest notifications are discarded permanently. Check the receiver's health and, if authentication is configured, that its token or signing secret still matches."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#observability"

      # The escalation of both: the caps have started discarding notifications the receiver never
      # took. Critical rather than warning, because unlike every other discard in this file there is
      # no backstop - no sweep, no rebuild, no way to ask again.
      - alert: HippocampusCallbacksAbandoning
        expr: sum(rate(hippocampus_callbacks_abandoned_total[15m])) > 0
        for: 5m
        labels:
          severity: critical
          service: hippocampus
        annotations:
          summary: "Hippocampus is discarding undelivered callbacks"
          description: "The callback queue has hit its caps and is discarding deliveries the receiver never accepted. These notifications are lost: nothing re-derives them, because the memories they describe are already gone. This means the receiver has been unreachable for long enough to exhaust callbacks.maxAgeHours or maxRows - treat it as a receiver outage, not as tuning, and expect a gap in whatever downstream system consumes these."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#observability"

      # The escalation of the above: the caps have started discarding deletions the index never
      # took. This is the one condition here that leaves the index knowingly wrong until a sweep
      # finds it.
      - alert: HippocampusSearchOutboxAbandoning
        expr: sum(rate(hippocampus_search_outbox_abandoned_total[15m])) > 0
        for: 5m
        labels:
          severity: critical
          service: hippocampus
        annotations:
          summary: "Hippocampus is discarding queued search index deletions"
          description: "The delete outbox has hit its caps and is discarding queued index deletions before the cluster accepted them. Nothing is lost from the store, but the search index now holds documents whose memories are gone, and only the stale half of the reconciliation sweep will remove them - on its own schedule, which may be an hour. This means the index has been unable to keep up for long enough to exhaust opensearch.outbox.maxAgeHours or maxRows: treat it as an OpenSearch outage, not as tuning."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#observability"

      # Any non-zero value here is a bug: the request got Internal/500 and the process survived,
      # but a handler reached a state it was not written to reach.
      - alert: HippocampusPanicsRecovered
        expr: sum(increase(hippocampus_panics_recovered_total[15m])) > 0
        for: 5m
        labels:
          severity: warning
          service: hippocampus
        annotations:
          summary: "A Hippocampus handler panicked and was recovered"
          description: "A gRPC or gateway handler panicked; the caller received Internal/500 and the process survived. The stack trace is in the service logs. Any occurrence is worth investigating - please report it with the trace."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#observability"

  # The rules below are about the components that DIAL a Hippocampus instance - the broker bridges
  # and the ingestor - rather than about the service. They are in their own group because they are
  # published by other processes: a deployment running none of them produces none of these series,
  # and every rule here stays silent rather than firing on the absence.
  #
  # Two of them exist because of a real outage. A Bluesky bridge on the public demo spent hours
  # re-presenting one record it could never store, at a cursor that never moved: the process was up,
  # its /healthz answered, the store kept filling from a second goroutine, and nothing was being
  # reinforced. What that looks like in metrics is a stream of messages the store already had, or no
  # messages at all - so those are the two questions asked here.
  #
  # They aggregate `by (broker)` so one wedged bridge is not diluted by a healthy one beside it. If
  # you run more than one bridge of the SAME broker, add the `hippocampus_group` label
  # (the bridges' --metrics-group) to the aggregation, or they will merge.
  - name: hippocampus-clients
    interval: 1m
    rules:
      # --- Broker bridges ------------------------------------------------------------------

      # `exists` means the store already held what the message carried, which is a success (there is
      # nothing to redeliver) but not work: a bridge whose whole stream is duplicates is running,
      # healthy, and adding nothing. It is what a replayed subscription, a cursor that has stopped
      # advancing, or a broker redelivering a backlog all look like from here. Note that the routine
      # duplicates of a POLLED source are not counted - only a message handled off the stream is -
      # so a feed poller re-reading the same page every minute does not trip this.
      - alert: HippocampusBridgeDuplicateStream
        expr: sum by (broker) (rate(hippocampus_bridge_messages_total{outcome="exists"}[15m])) / clamp_min(sum by (broker) (rate(hippocampus_bridge_messages_total[15m])), 0.001) > 0.8 and sum by (broker) (rate(hippocampus_bridge_messages_total{outcome="exists"}[15m])) > 0.1
        for: 15m
        labels:
          severity: warning
          service: hippocampus
        annotations:
          summary: "A Hippocampus bridge is re-storing what the store already has"
          description: "Over 80% of the messages this bridge handles are records the store already held, so it is running without adding anything. The usual causes are a subscription replaying a backlog, an offset or cursor that has stopped advancing, or a bridge restarted against an old position. Check the bridge's logs for a repeating record id, and restart it if the position is stale - the Bluesky bridge resumes from the live tip when it has no cursor."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#client-side-components"

      # The opposite question, and the reason it is asked as a rate rather than with absent_over_time:
      # a bridge that has EXITED stops publishing, and absence cannot be told apart from a deployment
      # that runs no bridge at all. This fires only while a bridge is up and consuming nothing, which
      # is the broker disconnected, a subscription matching nothing, or a stream that has gone quiet.
      # A bridge that is gone is caught by its /readyz instead - declare it in topology.components.
      #
      # It is `count(... == 0) > 0` rather than the plain `... == 0` it wants to be because the
      # Grafana copy of this rule thresholds the query at `gt 0`: an expression whose firing VALUE
      # is zero evaluates identically in Prometheus and never fires in Grafana. Every rule in both
      # files has to return a positive number while it should be firing.
      - alert: HippocampusBridgeNotConsuming
        expr: count by (broker) (sum by (broker) (rate(hippocampus_bridge_messages_total[15m])) == 0) > 0
        for: 15m
        labels:
          severity: warning
          service: hippocampus
        annotations:
          summary: "A Hippocampus bridge is up but consuming nothing"
          description: "This bridge has handled no messages for half an hour while continuing to report metrics, so it is running and not consuming. Check the broker end first - a disconnected consumer, a subscription or topic that matches nothing, or a source that has genuinely gone quiet. A bridge whose PROCESS has gone reports nothing at all and cannot be caught here; declare it under the service's topology.components to have its /readyz probed."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#client-side-components"

      # Deliberately a ratio rather than any failure at all: a poison message on a busy stream is a
      # trickle an operator does not need paging for, whereas a sustained fraction means the bridge
      # cannot write. On the at-least-once adapters the messages are redelivered and pile up; on NATS
      # they are gone.
      - alert: HippocampusBridgeWriteFailing
        expr: sum by (broker) (rate(hippocampus_bridge_messages_total{outcome="failed"}[10m])) / clamp_min(sum by (broker) (rate(hippocampus_bridge_messages_total[10m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: critical
          service: hippocampus
        annotations:
          summary: "A Hippocampus bridge is failing to store what it consumes"
          description: "Over 5% of this bridge's messages are failing to transform or store. The at-least-once adapters (MQTT, RabbitMQ, Kafka, Bluesky) will redeliver them and fall behind; NATS is at-most-once and they are lost. Check hippocampus.client.rpc.requests for the code the service is returning - a rejected token, an unreachable instance and a malformed record all land here."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#client-side-components"

      # --- Anything that dials the service -------------------------------------------------

      # The silent one. A component authenticating with a static token keeps running perfectly after
      # that token expires - it just fails every write, for as long as the process lives, and the
      # service-side error rate calls it a client fault because that is what it is. This is the only
      # rule that names a code rather than an outcome, for exactly that reason.
      - alert: HippocampusClientTokenRejected
        expr: sum by (endpoint) (rate(hippocampus_client_rpc_requests_total{code=~"Unauthenticated|PermissionDenied"}[10m])) > 0
        for: 10m
        labels:
          severity: critical
          service: hippocampus
        annotations:
          summary: "A Hippocampus client's token is being refused"
          description: "A bridge, the ingestor, or another client is having its calls rejected as Unauthenticated or PermissionDenied, so it is running and writing nothing. An expired static --token is the usual cause and it never recovers on its own; against an IdP-backed service use the client-credentials grant (--oidc-client-id) so the component mints and refreshes its own. PermissionDenied instead means the token verifies but its role is below the RPC's tier."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#client-side-components"

      # --- Ingestor ------------------------------------------------------------------------

      # Every other ingestor metric is a counter, and a counter that stops advancing is
      # indistinguishable from an ingestor with nothing to promote. This gauge rises on its own
      # whether the loop is stalled, deadlocked or dead, which is why it is the staleness signal
      # rather than the absence of promotions.
      - alert: HippocampusIngestorPassStale
        expr: max(hippocampus_ingestor_seconds_since_last_pass) > 900
        for: 10m
        labels:
          severity: critical
          service: hippocampus
        annotations:
          summary: "The Hippocampus ingestor has not completed a pass in 15 minutes"
          description: "No pass has completed for 15 minutes, so completed events are accumulating on the edge instance unjudged - and an edge holds them only for as long as its own consolidation.minimumRetentionInDays. Check that both ends are reachable (the ingestor's /readyz names which one is not). Raise this threshold if a pass over your edge store legitimately takes longer than the default 30s interval by that much."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#client-side-components"

      # A rule whose expression errors does not match, is logged, and does not stop the rules after
      # it - which is the right behaviour and also completely invisible from the outside. A rule
      # erroring on every event silently changes what is promoted, so any sustained rate is worth a
      # look at the rules file.
      - alert: HippocampusIngestorRuleErrors
        expr: sum by (rule) (rate(hippocampus_ingestor_rule_errors_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
          service: hippocampus
        annotations:
          summary: "A Hippocampus ingestor rule is erroring rather than matching"
          description: "This rule's CEL expression is erroring when evaluated, so it never matches and the events it was meant to judge are falling through to whatever follows it. The classic cause is an unguarded map index such as event.metadata['k'] on an event that does not carry the key - guard it with 'k' in event.metadata. The ingestor logs the rule name and the error; --check-rules compiles the file without running a pass."
          runbook_url: "https://github.com/fastbean-au/hippocampus/blob/main/docs/operations.md#client-side-components"
