# An ExternalSecret that replaces an overlay's demo secret.yaml (TODO-3 item 170). It needs the
# External Secrets Operator (external-secrets.io) and a SecretStore or ClusterSecretStore for your
# provider (AWS Secrets Manager, GCP Secret Manager, Vault, Azure Key Vault, ...).
#
# To use it: delete `- secret.yaml` from the overlay's resources, add this file to them (or apply it
# on its own), and set secretStoreRef and the remoteRef keys to what your provider holds. The target
# is the same `hippocampus-secrets` Secret, with the same keys, so the deployments need no change.
# The keys are the postgres overlay's; for the mysql overlay use mysql-password and
# mysql-root-password instead of postgres-password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hippocampus-secrets
  namespace: hippocampus
  labels:
    app.kubernetes.io/name: hippocampus
    app.kubernetes.io/part-of: hippocampus
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: my-secret-store # CHANGE ME
  target:
    name: hippocampus-secrets
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: hippocampus/postgres # CHANGE ME
        property: password
    - secretKey: signing-secret
      remoteRef:
        key: hippocampus/auth # CHANGE ME
        property: signing-secret
