# Demo-grade secret so `kubectl apply -k` works out of the box against the bundled in-cluster
# MySQL. REPLACE THESE VALUES before any real use — commit your real secret through your own
# secret-management tooling (Sealed Secrets, External Secrets, SOPS, a cloud secret store, ...),
# not to git.
#
# mysql-password is the single source of truth for the application user's password: the MySQL
# StatefulSet consumes it as MYSQL_PASSWORD, and each Hippocampus pod interpolates it into the DSN
# (see the deployments' env), so there is only one place to rotate it. mysql-root-password is the
# server's root password, which nothing in Hippocampus uses.
#
# signing-secret is the HMAC token-signing key. It is wired into the pods' environment but inert
# until you set auth.method to "hmac" in config.json (see deploy/k8s/README.md → Authentication).
apiVersion: v1
kind: Secret
metadata:
  name: hippocampus-secrets
  labels:
    app.kubernetes.io/name: hippocampus
    app.kubernetes.io/part-of: hippocampus
type: Opaque
stringData:
  mysql-password: "CHANGE-ME-mysql-password"
  mysql-root-password: "CHANGE-ME-mysql-root-password"
  signing-secret: "CHANGE-ME-hmac-signing-secret"
