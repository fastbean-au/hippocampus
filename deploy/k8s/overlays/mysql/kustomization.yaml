# Centralised MySQL deployment: one consolidator + N read/write replicas over a shared database,
# the same shape as the postgres overlay on the other server driver (TODO-3 item 170). Apply with:
#
#   kubectl apply -k deploy/k8s/overlays/mysql
#
# MySQL 8.0.20 or later is required (see docs/configuration.md). For production, remove mysql.yaml
# from `resources` below and point the deployments' DSN at a managed MySQL, and replace secret.yaml
# with a real secret (see README).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hippocampus

resources:
  - ../../base
  - secret.yaml
  - mysql.yaml # DEMO MySQL — drop this line to use an external database
  - deployment-consolidator.yaml
  - deployment-replica.yaml
  - pdb.yaml

# Content-hashed ConfigMap: editing config.json rolls both deployments automatically.
configMapGenerator:
  - name: hippocampus-config
    files:
      - config.json

images:
  - name: ghcr.io/fastbean-au/hippocampus
    newTag: "0.52.1"
