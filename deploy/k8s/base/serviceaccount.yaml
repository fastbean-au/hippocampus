# Hippocampus talks only to its own storage backend and (optionally) OpenSearch/OTLP — it never
# calls the Kubernetes API. So the pod's service-account token is not mounted: nothing inside the
# container needs it, and omitting it removes a credential an attacker could otherwise reach.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hippocampus
  labels:
    app.kubernetes.io/name: hippocampus
    app.kubernetes.io/part-of: hippocampus
automountServiceAccountToken: false
