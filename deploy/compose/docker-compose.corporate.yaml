# Corporate / centralised Hippocampus: PostgreSQL primary store + OpenSearch content-search
# index (a centralised deployment shape). The postgres-driver, opensearch-enabled
# config is mounted over the image default; the hippocampus container is stateless (all state
# lives in postgres and opensearch).
#
#   podman-compose -f deploy/compose/docker-compose.corporate.yaml up --build -d
#   (or: docker compose -f deploy/compose/docker-compose.corporate.yaml up --build -d)
#
# Ports published for local tooling:
#   50051 gRPC, 8080 HTTP/JSON gateway (+ /healthz, + /ui console),
#   9200 OpenSearch, 5432 PostgreSQL.
#
# Security note: the OpenSearch security plugin is disabled and postgres uses a trivial password
# for demo convenience only - do not expose this stack as-is.

services:
  hippocampus:
    build: ../..
    ports:
      - "50051:50051"
      - "8080:8080"
      - "9464:9464" # Prometheus scrape endpoint (only listening when PROMETHEUS=true)
    volumes:
      - ./config.corporate.json:/etc/hippocampus/config.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      # Ship metrics/traces to the otel-lgtm collector only when OBSERVABILITY is set and the
      # `observability` profile is active; off by default so no export failures are logged.
      HIPPOCAMPUS_OBSERVABILITY_METRICS_ENABLED: "${OBSERVABILITY:-false}"
      HIPPOCAMPUS_OBSERVABILITY_TRACING_ENABLED: "${OBSERVABILITY:-false}"
      HIPPOCAMPUS_OBSERVABILITY_OTLP_ENDPOINT: "otel-lgtm:4317"
      HIPPOCAMPUS_OBSERVABILITY_OTLP_INSECURE: "true"
      # The scrape endpoint, the pull half of the same metrics. Separate from OBSERVABILITY
      # because it needs no collector at all: PROMETHEUS=true publishes them on :9464 for a
      # Prometheus (or a curl) to read, which is what the rule files in
      # deploy/observability/ are written against.
      HIPPOCAMPUS_OBSERVABILITY_PROMETHEUS_ENABLED: "${PROMETHEUS:-false}"
      # Embedded-LLM summarisation (optional). Off unless LLM=true.
      #
      # Two ways to run it, and on a corporate network the second is usually the point. Either start
      # the bundled Ollama with the `ollama` profile and pull the model once the stack is up:
      #   docker compose -f deploy/compose/docker-compose.corporate.yaml exec ollama ollama pull "${LLM_MODEL:-llama3.2}"
      # or point it at a model endpoint the organisation already sanctions - anything speaking the
      # OpenAI API, which is every gateway worth the name - and run no inference server here at all:
      #   LLM=true LLM_PROVIDER=openai LLM_ADDRESS=https://gateway.internal/v1 \
      #     LLM_MODEL=gpt-4o-mini HIPPOCAMPUS_LLM_APIKEY=... docker compose ... up
      # The summariser is the one component that reads memory content, so which endpoint this names
      # is a data-handling decision - see docs/security.md.
      HIPPOCAMPUS_LLM_ENABLED: "${LLM:-false}"
      HIPPOCAMPUS_LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      HIPPOCAMPUS_LLM_ADDRESS: "${LLM_ADDRESS:-http://ollama:11434}"
      HIPPOCAMPUS_LLM_MODEL: "${LLM_MODEL:-llama3.2}"
      HIPPOCAMPUS_LLM_AUTOSUMMARISE: "${LLM_AUTOSUMMARISE:-false}"
      # Injected from the environment, never written here: a key in a committed compose file is a
      # committed secret.
      HIPPOCAMPUS_LLM_APIKEY: "${HIPPOCAMPUS_LLM_APIKEY:-}"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hippocampus
      POSTGRES_PASSWORD: hippocampus
      POSTGRES_DB: hippocampus
    ports:
      - "5432:5432"
    volumes:
      - corporate-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hippocampus -d hippocampus"]
      interval: 5s
      timeout: 3s
      retries: 12

  opensearch:
    image: opensearchproject/opensearch:3.1.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - corporate-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 24

  # All-in-one observability backend (Grafana + Prometheus + Tempo + Loki + OTel collector). The
  # natural home for the centralised stack's dashboards. Off by default; started only with
  # `--profile observability`:
  #
  #   OBSERVABILITY=true docker compose -f deploy/compose/docker-compose.corporate.yaml \
  #     --profile observability up --build
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    profiles: ["observability"]
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP/gRPC ingest
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/hippocampus.json
    volumes:
      - ./observability/hippocampus-dashboard.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/hippocampus.json:ro
      - ./observability/dashboards-provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      # Alert rules, provisioned alongside the dashboard so the stack alerts as well as draws.
      # No contact point is provisioned, so firing rules are visible under Alerting > Alert rules.
      - ./observability/alerting-rules.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/hippocampus.yaml:ro

  # Optional embedded LLM for summarisation. Off by default; started only with `--profile ollama`
  # (and LLM=true so the service uses it). Not needed at all under LLM_PROVIDER=openai, which points
  # the service at an endpoint you already run:
  #
  #   LLM=true docker compose -f deploy/compose/docker-compose.corporate.yaml --profile ollama up --build
  #   docker compose -f deploy/compose/docker-compose.corporate.yaml exec ollama ollama pull llama3.2
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - corporate-ollama-models:/root/.ollama

volumes:
  corporate-postgres-data:
  corporate-opensearch-data:
  corporate-ollama-models:
