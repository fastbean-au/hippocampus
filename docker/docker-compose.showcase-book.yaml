# Hosted "book" showcase: Great Expectations reloaded and summarised every 24h, decaying under a
# compressed clock. Brings up the full server side - Postgres primary store, OpenSearch content
# search, a Keycloak IdP protecting the console, and the otel-lgtm telemetry stack - fronted by Caddy
# with automatic HTTPS. Caddy also solves the split-issuer problem: because it carries the public
# hostnames as compose-network aliases, the hippocampus container reaches Keycloak at the very same
# URL the browser uses, so the token issuer matches the service's configured issuer (see
# Caddyfile.book).
#
#   BOOK_DOMAIN=book.example ACME_EMAIL=you@example.com \
#     docker compose -f docker/docker-compose.showcase-book.yaml up --build -d
#
# The data generator is NOT a container here (its module pulls a private dependency a clean image
# build cannot fetch without credentials); it runs as a host process against the published gRPC port.
# See docs/showcase.md for the exact `cmd/book` command and the systemd unit, and for how to run this
# locally without a public domain.
#
# Requires public DNS records for ${BOOK_DOMAIN}, auth.${BOOK_DOMAIN}, grafana.${BOOK_DOMAIN} → the
# VM, with ports 80/443 reachable for the ACME challenge. Browse:
#   console:  https://${BOOK_DOMAIN}/ui
#   keycloak: https://auth.${BOOK_DOMAIN}/   (admin/admin; demo users reader-demo/writer-demo/admin-demo)
#   grafana:  https://grafana.${BOOK_DOMAIN}/
#   gRPC:     <vm>:50051   (for the host-run generator)
#
# SECURITY: demo passwords (Postgres, Keycloak admin, the gen client secret in the realm) - change
# them for anything beyond a throwaway showcase VM.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BOOK_DOMAIN: "${BOOK_DOMAIN:-book.hippocampus.example}"
      ACME_EMAIL: "${ACME_EMAIL:-admin@example.com}"
    volumes:
      - ./caddy/Caddyfile.book:/etc/caddy/Caddyfile:ro
      - book-caddy-data:/data
      - book-caddy-config:/config
    networks:
      default:
        aliases:
          - "${BOOK_DOMAIN:-book.hippocampus.example}"
          - "auth.${BOOK_DOMAIN:-book.hippocampus.example}"
          - "grafana.${BOOK_DOMAIN:-book.hippocampus.example}"
    depends_on:
      - hippocampus
      - keycloak
      - otel-lgtm

  hippocampus:
    build: ..
    restart: unless-stopped
    ports:
      - "${BOOK_GRPC_PORT:-50051}:50051"
    volumes:
      - ./config.showcase-book.json:/etc/hippocampus/config.json:ro
    environment:
      # The issuer both the browser and this container reach (the latter via the caddy alias). Must
      # be identical on both sides, which is exactly what the shared Caddy hostname guarantees.
      HIPPOCAMPUS_AUTH_ISSUER: "https://auth.${BOOK_DOMAIN:-book.hippocampus.example}/realms/hippocampus"
      HIPPOCAMPUS_AUTH_UI_ISSUER: "https://auth.${BOOK_DOMAIN:-book.hippocampus.example}/realms/hippocampus"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      keycloak:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hippocampus
      POSTGRES_PASSWORD: hippocampus
      POSTGRES_DB: hippocampus
    volumes:
      - book-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hippocampus -d hippocampus"]
      interval: 5s
      timeout: 3s
      retries: 12

  opensearch:
    image: opensearchproject/opensearch:3.1.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - book-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 24

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      # Full external URL so the token issuer is the public https address; KC_PROXY_HEADERS makes
      # Keycloak trust Caddy's X-Forwarded-* so it knows the request arrived over TLS.
      KC_HOSTNAME: "https://auth.${BOOK_DOMAIN:-book.hippocampus.example}"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/realm-hippocampus.json:/opt/keycloak/data/import/realm.json:ro
      - book-keycloak-data:/opt/keycloak/data

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "https://grafana.${BOOK_DOMAIN:-book.hippocampus.example}/"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/hippocampus.json
    volumes:
      - ./observability/hippocampus-dashboard.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/hippocampus.json:ro
      - ./observability/dashboards-provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro

volumes:
  book-postgres-data:
  book-opensearch-data:
  book-keycloak-data:
  book-caddy-data:
  book-caddy-config:
