# Hosted "logs" showcase: a continuous log trickle, reaped by consolidation and capacity eviction so
# the store stays bounded (no daily reset - the counterpart to the book stack). Same server side and
# Caddy/HTTPS split-issuer design as the book stack, on the logs domain, so both run side by side on
# one host. See the book compose and Caddyfile.book for the design notes; the differences are the
# config file, the domain, the gRPC port, and the volume names.
#
#   LOGS_DOMAIN=logs.example ACME_EMAIL=you@example.com \
#     docker compose -f docker/docker-compose.showcase-logs.yaml up --build -d
#
# The generator runs as a host process against the published gRPC port (see docs/showcase.md).
#
# Requires public DNS for ${LOGS_DOMAIN}, auth.${LOGS_DOMAIN}, grafana.${LOGS_DOMAIN} → the VM.
#   console:  https://${LOGS_DOMAIN}/ui
#   keycloak: https://auth.${LOGS_DOMAIN}/    (admin/admin; demo users reader-demo/writer-demo/admin-demo)
#   grafana:  https://grafana.${LOGS_DOMAIN}/
#   gRPC:     <vm>:50052

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LOGS_DOMAIN: "${LOGS_DOMAIN:-logs.hippocampus.example}"
      ACME_EMAIL: "${ACME_EMAIL:-admin@example.com}"
    volumes:
      - ./caddy/Caddyfile.logs:/etc/caddy/Caddyfile:ro
      - logs-caddy-data:/data
      - logs-caddy-config:/config
    networks:
      default:
        aliases:
          - "${LOGS_DOMAIN:-logs.hippocampus.example}"
          - "auth.${LOGS_DOMAIN:-logs.hippocampus.example}"
          - "grafana.${LOGS_DOMAIN:-logs.hippocampus.example}"
    depends_on:
      - hippocampus
      - keycloak
      - otel-lgtm

  hippocampus:
    build: ..
    restart: unless-stopped
    ports:
      - "${LOGS_GRPC_PORT:-50052}:50051"
    volumes:
      - ./config.showcase-logs.json:/etc/hippocampus/config.json:ro
    environment:
      HIPPOCAMPUS_AUTH_ISSUER: "https://auth.${LOGS_DOMAIN:-logs.hippocampus.example}/realms/hippocampus"
      HIPPOCAMPUS_AUTH_UI_ISSUER: "https://auth.${LOGS_DOMAIN:-logs.hippocampus.example}/realms/hippocampus"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      keycloak:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hippocampus
      POSTGRES_PASSWORD: hippocampus
      POSTGRES_DB: hippocampus
    volumes:
      - logs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hippocampus -d hippocampus"]
      interval: 5s
      timeout: 3s
      retries: 12

  opensearch:
    image: opensearchproject/opensearch:3.1.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - logs-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 24

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: "https://auth.${LOGS_DOMAIN:-logs.hippocampus.example}"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/realm-hippocampus.json:/opt/keycloak/data/import/realm.json:ro
      - logs-keycloak-data:/opt/keycloak/data

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "https://grafana.${LOGS_DOMAIN:-logs.hippocampus.example}/"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/hippocampus.json
    volumes:
      - ./observability/hippocampus-dashboard.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/hippocampus.json:ro
      - ./observability/dashboards-provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro

volumes:
  logs-postgres-data:
  logs-opensearch-data:
  logs-keycloak-data:
  logs-caddy-data:
  logs-caddy-config:
