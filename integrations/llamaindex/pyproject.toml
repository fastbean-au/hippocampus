# The distribution name follows LlamaIndex's own convention for an integration package -
# `llama-index-<category>-<name>`, importable as `llama_index.<category>.<name>` - so this one
# installs as `llama_index.memory.hippocampus` beside `llama_index.memory.mem0`. `llama_index` and
# `llama_index.memory` are implicit namespace packages, which is why neither carries an
# __init__.py here: adding one would shadow every other integration in the same namespace.
[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "llama-index-memory-hippocampus"
dynamic = ["version"]
description = "A LlamaIndex long-term memory block backed by Hippocampus, a memory service that forgets what stops mattering."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "fastbean-au" }]
keywords = ["hippocampus", "llama-index", "llamaindex", "memory", "agent", "llm"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Front-Ends",
    "Typing :: Typed",
]

# The `hippocampus-client` floor is the release in which that package first exists, which is also
# the release this one first ships from: both are published from the same tag, so a lower floor
# could only ever name a distribution that was never uploaded. It is deliberately a floor and not a
# pin - a newer client is a newer contract, and nothing here reads a field the older one lacked.
#
# The llama-index-core floor is 0.12.36 because that is the release which first exported
# `BaseMemoryBlock` - 0.12.35 has `Memory` and not the block base class, so a floor chosen by
# reading a changelog rather than by installing it would be off by one and would fail at import.
# The CI job runs against the floor as well as the newest release, on the same reasoning the client
# package tests its interpreter floor: a floor nothing installs is a floor that is wrong.
dependencies = [
    "llama-index-core>=0.12.36",
    "hippocampus-client>=0.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "build>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/fastbean-au/hippocampus"
Documentation = "https://github.com/fastbean-au/hippocampus/blob/main/docs/llamaindex.md"
Source = "https://github.com/fastbean-au/hippocampus"
Changelog = "https://github.com/fastbean-au/hippocampus/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/llama_index/memory/hippocampus/_version.py"

# The package root is the namespace root, not the leaf: hatchling maps `src/llama_index` onto
# `llama_index`, and the two directories above the leaf stay __init__.py-less so the installed tree
# merges with llama-index-core's rather than replacing it.
[tool.hatch.build.targets.wheel]
packages = ["src/llama_index"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
