# Hippocampus with the default embedded SQLite storage. The database file lives in a named
# volume so it survives container replacement.
#
#   docker compose up --build
#
# Observability (optional): the `observability` profile adds an all-in-one grafana/otel-lgtm
# collector (Grafana + Prometheus + Tempo + Loki). Start it and tell the service to ship to it:
#
#   OBSERVABILITY=true docker compose --profile observability up --build
#
# Then open Grafana at http://localhost:3000. Without OBSERVABILITY set, metrics/traces stay off
# and the service never attempts (or logs a failure) to export.

services:
  hippocampus:
    build:
      context: .
      # VERSION is stamped into the binary at build time (see the Dockerfile). It defaults to "dev"
      # so a plain `docker compose up --build` is unchanged; set VERSION to build a specific tag.
      args:
        VERSION: "${VERSION:-dev}"
    ports:
      - "50051:50051" # gRPC
      - "8080:8080" # HTTP/JSON gateway (+ /healthz)
    volumes:
      - hippocampus-data:/data
    environment:
      HIPPOCAMPUS_OBSERVABILITY_METRICS_ENABLED: "${OBSERVABILITY:-false}"
      HIPPOCAMPUS_OBSERVABILITY_TRACING_ENABLED: "${OBSERVABILITY:-false}"
      HIPPOCAMPUS_OBSERVABILITY_OTLP_ENDPOINT: "otel-lgtm:4317"
      HIPPOCAMPUS_OBSERVABILITY_OTLP_INSECURE: "true"
      # Embedded-LLM summarisation (optional). Off unless OLLAMA=true, which also requires the
      # `ollama` profile (below). When on, SummariseMemories and (with OLLAMA_AUTOSUMMARISE=true)
      # the sleep cycle condense an event's memories via the ollama service. Pull the model first:
      #   docker compose exec ollama ollama pull "${OLLAMA_MODEL:-llama3.2}"
      HIPPOCAMPUS_OLLAMA_ENABLED: "${OLLAMA:-false}"
      HIPPOCAMPUS_OLLAMA_ADDRESS: "http://ollama:11434"
      HIPPOCAMPUS_OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2}"
      HIPPOCAMPUS_OLLAMA_AUTOSUMMARISE: "${OLLAMA_AUTOSUMMARISE:-false}"
      # Lets the swagger-ui container below (a different origin) call /v1 from the browser. It is
      # set unconditionally because it costs nothing while that profile is down: CORS headers are
      # only ever sent in response to a request carrying this exact Origin, and with no swagger-ui
      # running nothing does. Credentials are never allowed, whatever is listed here.
      HIPPOCAMPUS_GATEWAY_CORSORIGINS: "http://localhost:8082"

  # Optional Swagger UI, a browser form over the /v1 JSON API. Off by default; started only with
  # `--profile swagger`, then browse to http://localhost:8082.
  #
  # SWAGGER_JSON_URL is resolved by the BROWSER, not by this container, so it must be the published
  # host address rather than the compose-internal `hippocampus:8080` - which would resolve to
  # nothing outside the network and present as an empty page. That URL is also what "Try it out"
  # calls are addressed against: the generated document declares no `host`, and Swagger UI resolves
  # operations against the origin that served the spec. Fetching it from the gateway is therefore
  # what makes the interactive half work, and is why this needs the CORS origin above rather than a
  # mounted copy of contract/hippocampus.swagger.json.
  #
  # Unauthenticated, like the rest of this demo stack - do not expose it as-is. Against an instance
  # with auth on, use the Authorize box (the document declares a bearer securityDefinition).
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    profiles: ["swagger"]
    environment:
      SWAGGER_JSON_URL: "http://localhost:8080/v1/openapi.json"
    ports:
      - "8082:8080" # Swagger UI
    depends_on:
      - hippocampus

  # Optional MCP bridge over the streamable-HTTP transport, so an MCP host (Claude Desktop/Code) can
  # reach this embedded instance's memory tools over the network. Off by default; started only with
  # `--profile mcp`. It dials the hippocampus service over the compose network and exposes the MCP
  # endpoint on :8090. The more common local pattern is the stdio transport, where the host spawns
  # the binary itself and dials the exposed :50051 - no container needed; see docs/mcp.md. This
  # endpoint is unauthenticated, like the rest of this demo stack - do not expose it as-is.
  mcp:
    build:
      context: .
      target: mcp
      args:
        VERSION: "${VERSION:-dev}"
    profiles: ["mcp"]
    command:
      - "--address"
      - "hippocampus:50051"
      - "--transport"
      - "http"
      - "--http-address"
      - ":8090"
    ports:
      - "8090:8090" # streamable-HTTP MCP endpoint
    depends_on:
      - hippocampus

  # All-in-one observability backend. Off by default; started only with `--profile observability`.
  # The Hippocampus overview dashboard is provisioned in and set as the Grafana home page.
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    profiles: ["observability"]
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP/gRPC ingest
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/hippocampus.json
    volumes:
      - ./deploy/compose/observability/hippocampus-dashboard.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/hippocampus.json:ro
      - ./deploy/compose/observability/dashboards-provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      # Alert rules, provisioned alongside the dashboard so the stack alerts as well as draws. No
      # contact point is provisioned (there is nowhere to send them here), so firing rules are
      # visible under Alerting > Alert rules. Same rules as deploy/observability/prometheus-alerts.yaml.
      - ./deploy/compose/observability/alerting-rules.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/hippocampus.yaml:ro

  # Optional embedded LLM for summarisation. Off by default; started only with `--profile ollama`
  # (and set OLLAMA=true so the service actually uses it):
  #
  #   OLLAMA=true docker compose --profile ollama up --build
  #   docker compose exec ollama ollama pull llama3.2   # one-time model pull
  #
  # Runs on CPU by default; for GPU acceleration add a `deploy.resources.reservations.devices`
  # block per the ollama image docs. Models persist in the ollama-models volume.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434" # Ollama HTTP API
    volumes:
      - ollama-models:/root/.ollama

volumes:
  hippocampus-data:
  ollama-models:
